name: core-and-build-only
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build TypeLay.slnx -c Release --nologo
      # These are dependency-free console test runners, not dotnet-test-discoverable projects.
      - run: dotnet tests/TypeLay.Core.Tests/bin/Release/net10.0/TypeLay.Core.Tests.dll
      # Hosted CI is NOT physical-key / unlocked-desktop / real-IME evidence.
