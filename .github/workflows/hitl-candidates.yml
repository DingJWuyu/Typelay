name: Recheck PRs against hitl
'on':
  push:
    branches: [hitl]
permissions: {}
jobs:
  pulls:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      open: ${{ steps.list.outputs.open }}
    steps:
    - name: Find the heads of open PRs targeting hitl
      id: list
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        pulls=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&base=hitl&per_page=100" \
          --jq '[.[][] | {number, head: .head.sha}] | @json')
        echo "open=$pulls" >> "$GITHUB_OUTPUT"
  candidate:
    needs: pulls
    if: ${{ needs.pulls.outputs.open != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pulls.outputs.open) }}
    name: PR ${{ matrix.number }} at ${{ matrix.head }}
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/pr-candidate.yml
    with:
      base: ${{ github.sha }}
      head: ${{ matrix.head }}
