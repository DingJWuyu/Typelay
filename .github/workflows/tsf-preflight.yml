name: TSF isolated diagnostics (not acceptance)
on:
  push:
    branches: [work/linux-usability]
permissions:
  contents: read
concurrency:
  group: typelay-tsf-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      ${{ !github.event.deleted && contains(github.event.head_commit.message, 'TypeLay-TSF-Preflight: true') }}
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify this push explicitly requests the changed read-only probe
        id: gate
        shell: pwsh
        run: |
          python -B tests/windows/tsf_probe/preflight.py --check-push
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify report boundaries (not Windows or IME acceptance)
        if: steps.gate.outputs.eligible == 'true'
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests/windows/tsf_probe -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe existing prerequisites without registration or input changes
        if: steps.gate.outputs.eligible == 'true'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Path artifacts/tsf-preflight -ErrorAction Stop | Out-Null
          python -B tests/windows/tsf_probe/preflight.py --output artifacts/tsf-preflight/result.json
          $code = $LASTEXITCODE
          if ($code -ne 2) { throw "Unexpected probe exit code: $code" }
          $report = Get-Content -LiteralPath artifacts/tsf-preflight/result.json -Raw | ConvertFrom-Json
          if ($report.schemaVersion -ne 1 -or $report.kind -ne 'tsf-readonly-prerequisites' -or
              $report.status -ne 'observed-prerequisites-only' -or $report.runner.GITHUB_SHA -ne $env:GITHUB_SHA -or
              $report.productAcceptance -ne $false -or $report.registrationAttempts -ne 0 -or
              $report.activationAttempts -ne 0 -or $report.inputChanges -ne 0 -or
              $report.targetApplicationStarts -ne 0 -or $report.sourceTextReads -ne 0 -or
              $report.capabilities.registrationAllowed -ne $false -or $report.capabilities.writebackAllowed -ne $false) {
            throw 'Probe failed or report did not preserve the read-only boundary'
          }
          'Read-only prerequisite metadata collected. Not product acceptance; no registration or writeback authorized.' >> $env:GITHUB_STEP_SUMMARY
          exit 0
      - name: Preserve only this diagnostic report
        if: ${{ always() && steps.gate.outputs.eligible == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: typelay-tsf-readonly-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/tsf-preflight/result.json
          if-no-files-found: error
          retention-days: 7

  isolated-native:
    if: >-
      ${{ !github.event.deleted && (contains(github.event.head_commit.message, 'TypeLay-TSF-Lifecycle: true') || contains(github.event.head_commit.message, 'TypeLay-TSF-Read: true')) }}
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the explicit isolated level (no default read)
        id: gate
        shell: pwsh
        run: |
          python -B tests/windows/tsf_probe/preflight.py --check-native-push
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify diagnostic admission and build-entry contracts
        if: steps.gate.outputs.eligible == 'true'
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests/windows/tsf_probe -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record candidate blobs and enforce the verified baseline for Read
        if: steps.gate.outputs.eligible == 'true'
        shell: pwsh
        run: |
          $sources = @('tests/windows/tsf_probe/native/observer.cpp', 'tests/windows/tsf_probe/native/runner.cpp',
            'tests/windows/tsf_probe/native/test_outcome.cpp', 'tests/windows/tsf_probe/native/protocol.h',
            'tests/windows/tsf_probe/native/outcome.h', 'tests/windows/tsf_probe/build_native.py')
          if ('${{ steps.gate.outputs.level }}' -eq 'read') {
            git diff --exit-code 889a06469e47632d55f2107174f7c3cd7c4a16ff HEAD -- @sources
            if ($LASTEXITCODE -ne 0) { throw 'Native source differs from the verified lifecycle baseline' }
          }
          git diff --exit-code HEAD -- @sources
          if ($LASTEXITCODE -ne 0) { throw 'Native working tree differs from the checked commit' }
          $blobs = @(git ls-tree -r HEAD -- @sources)
          if ($LASTEXITCODE -ne 0 -or $blobs.Count -ne 6) { throw 'Six native source blobs required' }
          New-Item -ItemType Directory -Path artifacts/tsf-native/reports -ErrorAction Stop | Out-Null
          @{ schemaVersion = 1; kind = 'native-source-blobs'; commit = $env:GITHUB_SHA;
             level = '${{ steps.gate.outputs.level }}'; blobs = $blobs } |
            ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8 artifacts/tsf-native/reports/source-baseline.json
          $blobs
      - name: Compile test sources with an already installed x64 MSVC toolchain
        if: steps.gate.outputs.eligible == 'true'
        timeout-minutes: 3
        shell: cmd
        run: |
          @echo off
          set "VSROOT="
          if not exist "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" exit /b 1
          for /f "usebackq delims=" %%V in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%V"
          if not defined VSROOT exit /b 1
          if not exist "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat" exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          python -B tests/windows/tsf_probe/build_native.py --output artifacts/tsf-native/bin
          if errorlevel 1 exit /b 1
      - name: Verify native protocol and pure outcome contracts without loading observer
        if: steps.gate.outputs.eligible == 'true'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & artifacts/tsf-native/bin/runner.exe --protocol-selftest | Set-Content -Encoding utf8 artifacts/tsf-native/reports/protocol.json
          if ($LASTEXITCODE -ne 0) { throw 'Native protocol selftest failed' }
          & artifacts/tsf-native/bin/test_outcome.exe
          if ($LASTEXITCODE -ne 0) { throw 'Lifecycle outcome contract failed' }
      - name: Collect existing environment metadata before the single read
        if: steps.gate.outputs.eligible == 'true' && steps.gate.outputs.level == 'read'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python -B tests/windows/tsf_probe/preflight.py --output artifacts/tsf-native/reports/environment.json
          $code = $LASTEXITCODE
          if ($code -ne 2) { throw "Unexpected environment probe exit: $code" }
          python -B tests/windows/tsf_probe/read_validation.py --kind environment --report artifacts/tsf-native/reports/environment.json --sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Environment collection incomplete; no read allowed' }
      - name: Observe only owned Notepad startup and normal exit (no observer DLL)
        if: steps.gate.outputs.eligible == 'true' && steps.gate.outputs.level == 'lifecycle'
        timeout-minutes: 2
        env:
          TYPELAY_ISOLATED_TSF_NATIVE: '1'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $directory = (Resolve-Path artifacts/tsf-native/reports).Path
          $dll = (Resolve-Path artifacts/tsf-native/bin/observer.dll).Path
          & artifacts/tsf-native/bin/runner.exe --lifecycle-only $directory $dll | Set-Content -Encoding utf8 artifacts/tsf-native/reports/lifecycle.json
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "Notepad lifecycle incomplete: exit $code" }
          python -B tests/windows/tsf_probe/read_validation.py --kind lifecycle --report artifacts/tsf-native/reports/lifecycle.json
          if ($LASTEXITCODE -ne 0) { throw 'No-DLL lifecycle contract not demonstrated' }
          'Owned Notepad lifecycle only. No observer loaded; no TSF/IME/read/write acceptance.' >> $env:GITHUB_STEP_SUMMARY
      - name: Execute exactly one owned synthetic read (not IME or write acceptance)
        if: steps.gate.outputs.eligible == 'true' && steps.gate.outputs.level == 'read'
        timeout-minutes: 2
        env:
          TYPELAY_ISOLATED_TSF_NATIVE: '1'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $directory = (Resolve-Path artifacts/tsf-native/reports).Path
          $dll = (Resolve-Path artifacts/tsf-native/bin/observer.dll).Path
          & artifacts/tsf-native/bin/runner.exe --single-read $directory $dll | Set-Content -Encoding utf8 artifacts/tsf-native/reports/read.json
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "Single read not supported or incomplete: exit $code; no retry" }
          python -B tests/windows/tsf_probe/read_validation.py --kind read --report artifacts/tsf-native/reports/read.json
          if ($LASTEXITCODE -ne 0) { throw 'Complete read and normal removal not demonstrated; no retry' }
          'One isolated synthetic read only. Chinese IME/coexistence and writeback remain unverified.' >> $env:GITHUB_STEP_SUMMARY
      - name: Preserve only bounded reports for the selected isolated level
        if: ${{ always() && steps.gate.outputs.eligible == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: typelay-tsf-${{ steps.gate.outputs.level }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/tsf-native/reports/*.json
          if-no-files-found: error
          retention-days: 7
