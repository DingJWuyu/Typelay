        run: python tests/linux/test_gtk_shortcut_input.py -v
      - name: Verify Linux test_settings_capture
        id: test-settings-capture
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python tests/linux/test_settings_capture.py -v
      - name: Verify Linux test_ordinary_desktop_lifecycle
