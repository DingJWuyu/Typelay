name: TypeLay checks
on:
  push:
    branches: [windows-preview, cachyos-preview]
  pull_request:
    branches: [windows-preview, cachyos-preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typelay-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive the exact build source
        run: |
          mkdir -p artifacts
          git archive --format=tar --prefix=typelay/ HEAD > artifacts/TypeLay-source.tar
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify shared behavior without Windows
        shell: pwsh
        run: ./dev.ps1 shared-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: typelay-shared-${{ github.sha }}
          path: |
            artifacts/shared-test-results/
            artifacts/TypeLay-source.tar
          if-no-files-found: warn
          retention-days: 14
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install developer tooling
        shell: pwsh
        run: |
          python -m pip install -r eng/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\Program Files\LLVM\bin' >> $env:GITHUB_PATH
      - name: Build, behavior regressions, contracts and formatting
        shell: pwsh
        env:
          TYPELAY_TRACE: ${{ github.workspace }}/artifacts/controller-trace.jsonl
        run: ./dev.ps1 check
      - name: Verify the controlled native adapter
        shell: pwsh
        run: ./dev.ps1 native-e2e
      - name: Package and test the relocated distribution
        shell: pwsh
        run: ./dev.ps1 pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: typelay-windows-${{ github.sha }}
          path: |
            artifacts/test-results/
            artifacts/controller-trace.jsonl
            artifacts/TypeLay-Windows-preview.zip
            artifacts/TypeLay-Windows-preview.zip.sha256
          if-no-files-found: warn
          retention-days: 14
  linux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 20
    steps:
      - name: Install target desktop build dependencies
        run: pacman -Syu --noconfirm git cmake ninja pkgconf gtk3 json-glib python python-gobject gtk-layer-shell niri mesa uv grim yad noto-fonts-cjk curl icu openssl zlib libxkbcommon-x11 xdg-desktop-portal-gtk xorg-server-xvfb xdotool dbus
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build the relocatable Linux client
        id: build
        run: python eng/build-linux.py --with-test-fixture
      - name: Exercise actual GTK fields in nested niri
        run: |
          Xvfb :99 -screen 0 1280x960x24 -nolisten tcp &
          export DISPLAY=:99
          python tests/linux/native_e2e.py --native artifacts/linux/native --output artifacts/linux/nested
      - name: Install and verify actual local translation components
        id: models
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p artifacts/linux/desktop-data artifacts/linux/desktop-cache
          python artifacts/linux/package/desktop/setup.py "$PWD/artifacts/linux/package" "$PWD/artifacts/linux/desktop-data/typelay" "$PWD/artifacts/linux/desktop-cache/typelay"
      # Temporary export of additional public desktop packages for local E2E.
      # No home directories, runner configuration or credentials are included.
      - name: Prepare additional native desktop applications
        run: |
          pacman -S --noconfirm --needed gtk4 qt6-base qt6-wayland qt6-tools chromium firefox waybar fcitx5 fcitx5-gtk fcitx5-qt fcitx5-chinese-addons python-atspi
          # NoExtract removes manuals listed in pacman's inventory. Export only
          # installed /usr files, never runner configuration or home directories.
          pacman -Qlq | sort -u > /tmp/typelay-package-inventory
          python - <<'PY'
          from pathlib import Path
          files = set(Path('/tmp/typelay-package-inventory').read_text().splitlines())
          for root in ('/usr/share/dotnet',):
              files.update(str(path) for path in Path(root).rglob('*'))
          with open('/tmp/typelay-package-files', 'w') as manifest:
              for name in sorted(files):
                  path = Path(name)
                  if name.startswith('/usr/') and (path.is_file() or path.is_symlink()):
                      manifest.write(name + '\n')
          PY
          tar --no-recursion -I 'zstd -T0 -3' -cf artifacts/TypeLay-linux-additional-packages.tar.zst -T /tmp/typelay-package-files
          test $(stat -c %s artifacts/TypeLay-linux-additional-packages.tar.zst) -lt 1500000000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typelay-additional-desktop-${{ github.sha }}
          path: artifacts/TypeLay-linux-additional-packages.tar.zst
          compression-level: 0
          retention-days: 1
      - name: Exercise the production desktop and a real GTK application
        if: ${{ !cancelled() && steps.models.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          export XDG_CONFIG_HOME="$PWD/artifacts/linux/desktop-config"
          export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
          export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
          python tests/linux/native_e2e.py --desktop --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: typelay-linux-${{ github.sha }}
          path: |
            artifacts/linux/nested/
            artifacts/linux/desktop/
            artifacts/linux/desktop-data/typelay/components/*/self-check.json
            artifacts/linux/native/libtypelay-gtk3.so
            artifacts/linux/native/typelay-supervise
            artifacts/TypeLay-Linux-preview-x86_64.tar.gz
            artifacts/TypeLay-Linux-preview-x86_64.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 14
# Passing this job does not certify physical Tab, Chinese IME, visual parity or safe universal writeback.
