          export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
          python tests/linux/native_e2e.py --desktop --desktop-scope qt --package artifacts/qt-runtime/TypeLay-Linux-preview --native artifacts/linux/native --output artifacts/linux/qt-desktop --fcitx-cooperative artifacts/qt-probe-root --qt-cooperative artifacts/linux/qt-cooperative
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: typelay-qt-iteration-${{ github.sha }}
          path: |
            artifacts/linux/qt-cooperative/*.json
            artifacts/linux/qt-cooperative/*.log
            artifacts/qt-runtime/provenance.txt
