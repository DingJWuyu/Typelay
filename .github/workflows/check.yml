name: TypeLay prototype visual review
on:
  push:
    branches: [work/visual-preview]
permissions:
  contents: read
jobs:
  render:
    if: github.ref == 'refs/heads/work/visual-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use the runner browser and official rendering tools
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          if [ -z "$(fc-list :lang=zh)" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
          npm install --prefix "$RUNNER_TEMP/typelay-render" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/typelay-render/node_modules/.bin/playwright" install ffmpeg
          echo "NODE_PATH=$RUNNER_TEMP/typelay-render/node_modules" >> "$GITHUB_ENV"
      - name: Render only the two interactive design prototypes
        run: node eng/render-prototypes.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: typelay-prototype-visual-${{ github.sha }}
          path: artifacts/prototype-review/
          if-no-files-found: error
          retention-days: 7
