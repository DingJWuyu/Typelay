name: TypeLay checks
on:
  push:
    branches: [hitl, trunk, "work/**"]
  pull_request:
    # Stack layers can target any lower branch. A rebased head gets fresh evidence.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      check_mode:
        description: Full checks or quality capture only (not product acceptance)
        type: choice
        required: false
        default: full
        options:
          - full
          - quality-only
      collect_translation_quality:
        description: Collect eight paired Linux responses once (diagnostic flags select their fixed sets)
        type: boolean
        required: false
        default: false
      hy_decode_comparison:
        description: "Compare only Hy ordinary greedy/sampled: 16 requests, 600 seconds, existing cache only"
        type: boolean
        required: false
        default: false
      fixed_model_diagnostics:
        description: Collect only fixed Argos boundary 32 and Hy ordinary 8 diagnostics (no quality verdict)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: typelay-checks-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.check_mode == 'quality-only' && 'quality-only' || 'full' }}
  cancel-in-progress: true
jobs:
  scope:
    name: ${{ github.event_name == 'pull_request' && 'PR' || github.event_name == 'push' && github.ref == 'refs/heads/hitl' && 'hitl push' || github.event_name == 'push' && 'branch push' || 'manual' }} / scope
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.select.outcome }}
      windows: ${{ steps.select.outputs.windows }}
      linux: ${{ steps.select.outputs.linux }}
      quality_only: ${{ steps.select.outputs.quality_only }}
      collect_quality: ${{ steps.select.outputs.collect_quality }}
      hy_decode_comparison: ${{ steps.select.outputs.hy_decode_comparison }}
      fixed_model_diagnostics: ${{ steps.select.outputs.fixed_model_diagnostics }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks from the actual platform branch changes
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HY_DECODE_COMPARISON: ${{ inputs.hy_decode_comparison }}
          FIXED_MODEL_DIAGNOSTICS: ${{ inputs.fixed_model_diagnostics }}
          CHECK_MODE: ${{ inputs.check_mode || 'full' }}
          COLLECT_TRANSLATION_QUALITY: ${{ inputs.collect_translation_quality }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          CI_EVIDENCE_PATH: artifacts/ci/source.json
        run: |
          python eng/shared/ci_scope.py
      - name: Preserve event and tested-source identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typelay-ci-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/source.json
          if-no-files-found: error
          retention-days: 14
  shared:
    name: ${{ github.event_name == 'pull_request' && 'PR' || github.event_name == 'push' && github.ref == 'refs/heads/hitl' && 'hitl push' || github.event_name == 'push' && 'branch push' || 'manual' }} / shared
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - name: Archive the exact build source
        run: |
          mkdir -p artifacts
          git archive --format=tar --prefix=typelay/ HEAD > artifacts/TypeLay-source.tar
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        with:
          python-version: '3.13'
      - name: Install repository Python tools
        id: python-tools
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python -m pip install -r eng/requirements.txt
      - name: Check repository Python lint
        id: python-lint
        if: ${{ !cancelled() && steps.python-tools.outcome == 'success' }}
        run: python -m ruff check .
      - name: Check repository Python formatting
        id: python-format
        if: ${{ !cancelled() && steps.python-tools.outcome == 'success' }}
        run: python -m ruff format --check --diff .
      - name: Verify Linux input feedback contracts
        id: input-feedback
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python tests/linux/input_feedback.py -v
      - name: Verify shared behavior without Windows
        id: shared-behavior
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        shell: pwsh
        run: ./dev.ps1 shared-check
      - name: Report required checks, including not-run prerequisites
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_REQUIRED_STEPS: python-lint python-format input-feedback shared-behavior
        run: python eng/shared/ci_report.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: typelay-shared-${{ github.sha }}
          path: |
            artifacts/shared-test-results/
            artifacts/TypeLay-source.tar
            artifacts/ci/
          if-no-files-found: warn
          retention-days: 14
  check:
    name: ${{ github.event_name == 'pull_request' && 'PR' || github.event_name == 'push' && github.ref == 'refs/heads/hitl' && 'hitl push' || github.event_name == 'push' && 'branch push' || 'manual' }} / check
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.selected == 'success' && needs.scope.outputs.windows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 85
    steps:
      - name: Record the Windows check budget start
        shell: pwsh
        run: '"TYPELAY_WINDOWS_CHECK_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        id: dotnet
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        with:
          python-version: '3.13'
      - name: Observe standard Chrome profile before Windows tests
        shell: pwsh
        run: python eng/windows/observe-browser-profile.py --stage before-tests --output artifacts/browser-profile/before-tests.json
      - name: Install developer tooling
        id: windows-tools
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        shell: pwsh
        run: |
          python -m pip install -r eng/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\Program Files\LLVM\bin' >> $env:GITHUB_PATH
      - name: Build the Windows workspace
        id: windows-build
        if: ${{ !cancelled() && steps.windows-tools.outcome == 'success' && steps.dotnet.outcome == 'success' }}
        shell: pwsh
        run: ./dev.ps1 build
      - name: Verify the Windows contract runner
        id: windows-contract-runner
        if: ${{ !cancelled() && steps.windows-tools.outcome == 'success' }}
        shell: pwsh
        run: python -m unittest discover -s tests/windows -p test_contract_runner.py -v
      - name: Verify Windows behavior and contracts
        id: windows-contracts
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        shell: pwsh
        env:
          TYPELAY_TRACE: ${{ github.workspace }}/artifacts/controller-trace.jsonl
        run: python eng/windows/test_contracts.py --configuration Release --results-directory artifacts/test-results
      - name: Preserve early Windows contract and rendering evidence
        if: ${{ !cancelled() && (steps.windows-contracts.outcome == 'success' || steps.windows-contracts.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typelay-windows-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/test-results/*.trx
            artifacts/test-results/contracts-*/*/*.trx
            artifacts/test-results/contracts-*/result.json
            artifacts/test-results/rendering/
          if-no-files-found: error
          retention-days: 14
      - name: Observe standard Chrome profile after behavior tests
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        shell: pwsh
        run: python eng/windows/observe-browser-profile.py --stage after-behavior-tests --output artifacts/browser-profile/after-behavior-tests.json
      - name: Verify Windows workspace formatting
        id: windows-format
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        shell: pwsh
        run: dotnet format TypeLay.slnx --verify-no-changes --no-restore
      - name: Verify worker behavior on Windows
        id: windows-worker
        if: ${{ !cancelled() && steps.windows-tools.outcome == 'success' }}
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/src/shared/TypeLay.Worker
        run: |
          python -m unittest discover -s tests/shared/worker -v
          exit $LASTEXITCODE
      - name: Verify the controlled native adapter
        id: windows-native
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        shell: pwsh
        run: ./dev.ps1 native-e2e
      - name: Verify continuous translation with the real local model
        id: windows-continuous
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        timeout-minutes: 25
        shell: pwsh
        run: |
          dotnet tests/windows/fixtures/TypeLay.DesktopFixture/bin/Release/net10.0-windows/TypeLay.DesktopFixture.dll --verify-continuous artifacts/continuous-translation src/shared/TypeLay.Worker/run_worker.py tests/windows/fixtures/TypeLay.NativeFixture/bin/Release/net10.0/TypeLay.NativeFixture.dll
          exit $LASTEXITCODE
      - name: Preserve early Windows continuous translation failure evidence
        if: ${{ !cancelled() && steps.windows-continuous.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typelay-windows-continuous-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/continuous-translation/result.json
            artifacts/continuous-translation/consumer-exit.json
          if-no-files-found: error
          retention-days: 14
      - name: Observe standard Chrome profile after continuous translation
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        shell: pwsh
        run: python eng/windows/observe-browser-profile.py --stage after-continuous --output artifacts/browser-profile/after-continuous.json
      - name: Restore the pinned cooperative-browser test archive
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        id: cooperative-browser-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/browser-download/chrome-win64.zip
          key: typelay-cft-win64-${{ hashFiles('tests/windows/support/chrome-for-testing.json') }}
      - name: Verify and prepare Chrome for Testing for the cooperative product path
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        id: cooperative-browser-prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content tests/windows/support/chrome-for-testing.json -Raw | ConvertFrom-Json
          $archive = Join-Path $PWD 'artifacts/browser-download/chrome-win64.zip'
          New-Item -ItemType Directory -Path (Split-Path $archive) -Force | Out-Null
          if (-not (Test-Path -LiteralPath $archive)) {
            Invoke-WebRequest -Uri $pin.archiveUrl -OutFile $archive -TimeoutSec 180
          }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.archiveSha256) {
            throw 'Chrome for Testing archive SHA-256 mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath artifacts/cooperative-browser
          $chrome = Join-Path $PWD 'artifacts/cooperative-browser/chrome-win64/chrome.exe'
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($chrome)
          if ($version.ProductVersion -ne $pin.version -or $version.ProductName -ne 'Google Chrome for Testing') {
            throw 'Chrome for Testing product/version mismatch.'
          }
          "chrome=$chrome" >> $env:GITHUB_OUTPUT
      - name: Cache the verified cooperative-browser archive
        if: ${{ !cancelled() && steps.cooperative-browser-prepare.outcome == 'success' && steps.cooperative-browser-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/browser-download/chrome-win64.zip
          key: ${{ steps.cooperative-browser-cache.outputs.cache-primary-key }}
      # Prepare fixed assets before the sole production package; inference stays serialized.
      - name: Admit the bounded production Hy package chain
        id: hy-admission
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:TYPELAY_WINDOWS_CHECK_START
          python eng/windows/admit-package-chain.py --elapsed-seconds $elapsed --report artifacts/hy-results/admission.json
          if ($LASTEXITCODE -ne 0) { throw 'Insufficient 85-minute job budget for the bounded ordinary-app and Hy chain.' }
          $pin = Get-Content src/shared/TypeLay.Worker/native/hy/assets.lock.json -Raw | ConvertFrom-Json
          "cache-key=typelay-hy-win-$($pin.model.sha256)-$($pin.runtime_archive.sha256)" >> $env:GITHUB_OUTPUT
      - name: Restore the fixed Hy model and CPU archive cache
        id: hy-cache
        if: ${{ !cancelled() && steps.hy-admission.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/hy-download/
          key: ${{ steps.hy-admission.outputs.cache-key }}
      - name: Prepare fixed Hy and Index assets without an audit adapter
        id: hy-prepare
        if: ${{ !cancelled() && steps.hy-admission.outcome == 'success' && steps.hy-cache.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          ./dev.ps1 hy-product-prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python eng/shared/prepare_index_model.py --output artifacts/index-model-download
          exit $LASTEXITCODE
      - name: Save only verified Hy download assets to cache
        if: ${{ !cancelled() && steps.hy-prepare.outcome == 'success' && steps.hy-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 2
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/hy-download/
          key: ${{ steps.hy-cache.outputs.cache-primary-key }}
      - name: Package and test the relocated distribution
        id: windows-package
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' && steps.hy-prepare.outcome == 'success' }}
        shell: pwsh
        env:
          TYPELAY_BROWSER_REGISTRATION_E2E: "1"
          TYPELAY_HY_WINDOWS_CPU_RUNTIME: artifacts/hy-runtime
        run: ./dev.ps1 pack -HyRuntime artifacts/hy-runtime
      - name: Verify cooperative browser input with the shipped app and real model
        id: windows-browser
        if: ${{ !cancelled() && steps.windows-package.outcome == 'success' && steps.cooperative-browser-prepare.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        env:
          TYPELAY_BROWSER_REGISTRATION_E2E: "1"
          # Only this fresh GitHub-hosted VM may use a verified empty standard container.
          TYPELAY_HOSTED_EMPTY_BROWSER_CONTAINER_E2E: ${{ runner.environment == 'github-hosted' && '1' || '0' }}
        run: |
          python eng/windows/observe-browser-profile.py --stage before-browser-cooperation --output artifacts/browser-profile/before-browser-cooperation.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixture = 'tests/windows/fixtures/TypeLay.DesktopFixture/bin/Release/net10.0-windows'
          foreach ($assembly in @('TypeLay.App', 'TypeLay.Runtime', 'TypeLay.Core', 'TypeLay.Protocol', 'TypeLay.Windows.Contracts')) {
            Copy-Item -LiteralPath "artifacts/package/TypeLay/app/$assembly.dll" -Destination "$fixture/$assembly.dll" -Force
          }
          dotnet tests/windows/fixtures/TypeLay.DesktopFixture/bin/Release/net10.0-windows/TypeLay.DesktopFixture.dll --verify-browser-cooperation artifacts/browser-cooperation artifacts/package/TypeLay '${{ steps.cooperative-browser-prepare.outputs.chrome }}'
          exit $LASTEXITCODE
      - name: Verify prior model consumers have exited before Notepad
        id: notepad-consumer-exit
        if: ${{ !cancelled() && steps.windows-package.outcome == 'success' && (steps.windows-browser.outcome == 'success' || steps.windows-browser.outcome == 'failure') }}
        shell: pwsh
        env:
          CONTINUOUS_NONCE: ${{ steps.windows-continuous.outputs.consumer_exit_nonce }}
          BROWSER_NONCE: ${{ steps.windows-browser.outputs.consumer_exit_nonce }}
          WORKFLOW_CANCELLED: ${{ job.status != 'success' && job.status != 'failure' }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Business failure stays red; neither prior consumer may still be active.
          python eng/windows/verify-consumer-exit.py --scope before-notepad --continuous-proof artifacts/continuous-translation/consumer-exit.json --browser-proof artifacts/browser-cooperation/consumer-exit.json --continuous-nonce "$env:CONTINUOUS_NONCE" --browser-nonce "$env:BROWSER_NONCE" --run-id "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT" --head "$env:GITHUB_SHA" --workflow-cancelled "$env:WORKFLOW_CANCELLED"
          exit $LASTEXITCODE
      - name: Verify real classic Notepad through shipped app Settings
        id: windows-ordinary-notepad
        if: ${{ !cancelled() && steps.notepad-consumer-exit.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          ./dev.ps1 package-e2e -Scenario ordinary-notepad
          exit $LASTEXITCODE
      # Scene failure stays red; only independently verified owner exit admits Hy.
      - name: Verify all prior model consumers have exited
        id: hy-consumer-exit
        if: ${{ !cancelled() && steps.windows-package.outcome == 'success' }}
        shell: pwsh
        env:
          CONTINUOUS_NONCE: ${{ steps.windows-continuous.outputs.consumer_exit_nonce }}
          BROWSER_NONCE: ${{ steps.windows-browser.outputs.consumer_exit_nonce }}
          NOTEPAD_NONCE: ${{ steps.windows-ordinary-notepad.outputs.consumer_exit_nonce }}
          WORKFLOW_CANCELLED: ${{ job.status != 'success' && job.status != 'failure' }}
        run: |
          python eng/windows/verify-consumer-exit.py --continuous-proof artifacts/continuous-translation/consumer-exit.json --browser-proof artifacts/browser-cooperation/consumer-exit.json --notepad-proof artifacts/ordinary-notepad/consumer-exit.json --continuous-nonce "$env:CONTINUOUS_NONCE" --browser-nonce "$env:BROWSER_NONCE" --notepad-nonce "$env:NOTEPAD_NONCE" --run-id "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT" --head "$env:GITHUB_SHA" --workflow-cancelled "$env:WORKFLOW_CANCELLED"
          exit $LASTEXITCODE
      - name: Verify the shipped Hy ABI5 worker and production process owner
        id: hy-production
        if: ${{ !cancelled() && steps.windows-package.outcome == 'success' && steps.hy-consumer-exit.outcome == 'success' }}
        timeout-minutes: 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./dev.ps1 package-e2e -Scenario hy-production
          exit $LASTEXITCODE
      - name: Verify Hy install select preview and remove through Settings
        id: hy-packages
        if: ${{ !cancelled() && steps.hy-production.outcome == 'success' }}
        timeout-minutes: 16
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./dev.ps1 package-e2e -Scenario hy-packages
          exit $LASTEXITCODE
      # Uses two minutes of the existing seven-minute cache/artifact tail, after
      # all prior desktop chains. It does not replace their failures or proofs.
      - name: Package and smoke the isolated physical Tab handoff
        id: physical-tab-package
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        timeout-minutes: 2
        shell: pwsh
        run: python eng/windows/package-physical-tab.py
      - name: Upload the isolated physical Tab validation package
        if: ${{ !cancelled() && steps.physical-tab-package.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typelay-windows-physical-tab-${{ github.sha }}
          path: |
            artifacts/TypeLay-Windows-physical-Tab-validation.zip
            artifacts/TypeLay-Windows-physical-Tab-validation.zip.sha256
          if-no-files-found: error
          retention-days: 14
      # Keep existing synthetic desktop diagnostics separate from the full package.
      # These results do not certify physical input or replace the full artifact.
      - name: Preserve small Windows desktop diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typelay-windows-desktop-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/continuous-translation/result.json
            artifacts/continuous-translation/consumer-exit.json
            artifacts/continuous-translation/trace*.jsonl
            artifacts/browser-cooperation/result.json
            artifacts/browser-cooperation/consumer-exit.json
            artifacts/browser-cooperation/trace*.jsonl
            artifacts/browser-cooperation/index-*.json
            artifacts/browser-cooperation/*.png
            artifacts/ordinary-notepad/result.json
            artifacts/ordinary-notepad/consumer-exit.json
            artifacts/ordinary-notepad/trace*.jsonl
          if-no-files-found: warn
          retention-days: 14
      - name: Report required checks, including not-run prerequisites
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_REQUIRED_STEPS: >-
            windows-build
            windows-contract-runner
            windows-contracts
            windows-format
            windows-worker
            windows-native
            windows-continuous
            cooperative-browser-prepare
            windows-package
            windows-browser
            notepad-consumer-exit
            windows-ordinary-notepad
            hy-consumer-exit
            hy-production
            hy-packages
            physical-tab-package
        run: python eng/shared/ci_report.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: typelay-windows-${{ github.sha }}
          path: |
            artifacts/ci/
            artifacts/test-results/
            artifacts/controller-trace.jsonl*
            artifacts/continuous-translation/data/setup-self-check.json
            artifacts/browser-profile/*.json
            artifacts/hy-results/*.json
            artifacts/hy-results/*.stderr
            artifacts/hy-production/*.json
            artifacts/hy-packages/*.json
            artifacts/hy-packages/first-miss-taskbar.png
            artifacts/hy-packages/trace.jsonl
            artifacts/hy-packages/trace.jsonl.overlay.jsonl
            artifacts/hy-packages/trace.jsonl.broker.jsonl
            artifacts/hy-packages/trace-cold.jsonl
            artifacts/hy-packages/trace-cold.jsonl.overlay.jsonl
            artifacts/hy-packages/trace-cold.jsonl.broker.jsonl
            artifacts/TypeLay-Windows-preview.zip
            artifacts/TypeLay-Windows-preview.zip.sha256
            artifacts/physical-tab-package/*.json
            artifacts/physical-tab-package/*.trx
            artifacts/physical-tab-package/*.log
            artifacts/physical-tab-package/*.stderr
            artifacts/physical-tab-package/*.txt
          if-no-files-found: warn
          retention-days: 14
  linux:
    name: ${{ github.event_name == 'pull_request' && 'PR' || github.event_name == 'push' && github.ref == 'refs/heads/hitl' && 'hitl push' || github.event_name == 'push' && 'branch push' || 'manual' }} / ${{ github.event_name == 'workflow_dispatch' && inputs.check_mode == 'quality-only' && 'Linux quality capture (not product acceptance)' || 'linux' }}
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.selected == 'success' && needs.scope.outputs.linux == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      # Electron's font service exceeds Docker's default 64 MiB /dev/shm.
      options: --shm-size=1g
    timeout-minutes: ${{ needs.scope.outputs.collect_quality == 'true' && 70 || 45 }}
    env:
      FIXED_MODEL_DIAGNOSTICS: ${{ needs.scope.outputs.fixed_model_diagnostics }}
      HY_DECODE_COMPARISON: ${{ needs.scope.outputs.hy_decode_comparison }}
      # Explicit ordinary quality capture now means the fixed eight-request paired set.
      TYPELAY_COMBINATION_ONLY: ${{ needs.scope.outputs.collect_quality == 'true' && needs.scope.outputs.fixed_model_diagnostics != 'true' && needs.scope.outputs.hy_decode_comparison != 'true' }}
      TYPELAY_COLLECT_TRANSLATION_QUALITY: ${{ needs.scope.outputs.collect_quality == 'true' }}
      TYPELAY_LINUX_CHECK_SECONDS: ${{ needs.scope.outputs.collect_quality == 'true' && 4200 || 2700 }}
      TYPELAY_EXPECT_QT_VERSION: 6.11.2
      CCACHE_DIR: ${{ github.workspace }}/artifacts/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 512MiB
      GTK4_PACKAGE_SHA256: 7386543a425d523b76f08a8269b530dcbebc45a53a68cfdef5251e8238d60dc9
      GTK4_SIGNATURE_SHA256: 894fd81f845eb49137d73056f62b27f2d194d2990ebe6dfdc956cd678db76048
      QT_PACKAGE_SHA256: 257c5ef6180119d5b4365bdfe2a2ad051694b5dff390eac8e736dd78b8107b21
      QT_SIGNATURE_SHA256: abf939ab10c2d7f28af81e5230c72e2acbd803fe43590fda331f474ec871dcfb
      LIBIME_PACKAGE_SHA256: adacfc6243df2544665a1d4cc8f2bf2ee6d4966fc2c5f2a37a3ff579134b6c67
      CHINESE_PACKAGE_SHA256: cc03b9d1d0bb921d88130e4ef17a4162a1037f6dbb0a165f6a73b83236f06ec4
    steps:
      - name: Mark explicit quality-only scope
        if: needs.scope.outputs.quality_only == 'true'
        run: echo 'Quality-only capture skips Windows and unrelated product scenes; this run is not full product acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record the Linux check budget start
        run: echo "TYPELAY_LINUX_CHECK_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Install target desktop build dependencies
        run: pacman -Syu --noconfirm git cmake ninja pkgconf gtk3 gtk4 gimp at-spi2-core json-glib python python-gobject libayatana-appindicator niri mesa uv grim noto-fonts-cjk curl icu openssl zlib libxkbcommon-x11 xdg-desktop-portal-gtk xorg-server-xvfb xdotool dbus chromium python-playwright firefox geckodriver code nodejs npm fcitx5 fcitx5-gtk fcitx5-chinese-addons boost libime patch fmt glib2-devel nlohmann-json expat xkeyboard-config iso-codes extra-cmake-modules gettext wayland-protocols plasma-wayland-protocols ccache opencc procps-ng zstd qt6-base libxkbcommon libxcb
      - name: Restore the fixed GTK4 package
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: gtk4-package-cache
        with:
          path: |
            /tmp/typelay-target-sdk/gtk4.pkg.tar.zst
            /tmp/typelay-target-sdk/gtk4.pkg.tar.zst.sig
          key: arch-gtk4-x86_64-${{ env.GTK4_PACKAGE_SHA256 }}-${{ env.GTK4_SIGNATURE_SHA256 }}
      - name: Match the target GTK4 upstream release
        id: gtk4-sdk
        run: |
          mkdir -p /tmp/typelay-target-sdk
          cd /tmp/typelay-target-sdk
          package='gtk4-1%3A4.22.5-1-x86_64.pkg.tar.zst'
          if [ '${{ steps.gtk4-package-cache.outputs.cache-hit }}' != true ]; then
            curl --fail --location "https://archive.archlinux.org/packages/g/gtk4/$package" -o gtk4.pkg.tar.zst
            curl --fail --location "https://archive.archlinux.org/packages/g/gtk4/$package.sig" -o gtk4.pkg.tar.zst.sig
          fi
          echo "$GTK4_PACKAGE_SHA256  gtk4.pkg.tar.zst" | sha256sum -c -
          echo "$GTK4_SIGNATURE_SHA256  gtk4.pkg.tar.zst.sig" | sha256sum -c -
          pacman -U --noconfirm ./gtk4.pkg.tar.zst
          test "$(pkg-config --modversion gtk4)" = 4.22.5
      - name: Save the verified GTK4 package
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.gtk4-sdk.outcome == 'success' && steps.gtk4-package-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            /tmp/typelay-target-sdk/gtk4.pkg.tar.zst
            /tmp/typelay-target-sdk/gtk4.pkg.tar.zst.sig
          key: ${{ steps.gtk4-package-cache.outputs.cache-primary-key }}
      - name: Restore the fixed Qt package
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: qt-package-cache
        with:
          path: |
            /tmp/typelay-target-sdk/qt6-base-6.11.2-3-x86_64.pkg.tar.zst
            /tmp/typelay-target-sdk/qt6-base-6.11.2-3-x86_64.pkg.tar.zst.sig
          key: arch-qt-x86_64-${{ env.QT_PACKAGE_SHA256 }}-${{ env.QT_SIGNATURE_SHA256 }}
      - name: Match the target Qt upstream ABI
        id: qt-sdk
        run: |
          mkdir -p /tmp/typelay-target-sdk
          cd /tmp/typelay-target-sdk
          package='qt6-base-6.11.2-3-x86_64.pkg.tar.zst'
          if [ '${{ steps.qt-package-cache.outputs.cache-hit }}' != true ]; then
            curl --fail --location "https://archive.archlinux.org/packages/q/qt6-base/$package" -o "$package"
            curl --fail --location "https://archive.archlinux.org/packages/q/qt6-base/$package.sig" -o "$package.sig"
          fi
          echo "$QT_PACKAGE_SHA256  qt6-base-6.11.2-3-x86_64.pkg.tar.zst" | sha256sum -c -
          echo "$QT_SIGNATURE_SHA256  qt6-base-6.11.2-3-x86_64.pkg.tar.zst.sig" | sha256sum -c -
          pacman -U --noconfirm "./$package"
          test "$(pkg-config --modversion Qt6Core)" = 6.11.2
          test -f /usr/lib/qt6/plugins/platforms/libqwayland.so
      - name: Save the verified Qt package
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.qt-sdk.outcome == 'success' && steps.qt-package-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            /tmp/typelay-target-sdk/qt6-base-6.11.2-3-x86_64.pkg.tar.zst
            /tmp/typelay-target-sdk/qt6-base-6.11.2-3-x86_64.pkg.tar.zst.sig
          key: ${{ steps.qt-package-cache.outputs.cache-primary-key }}
      - name: Initialize the disposable container D-Bus identity
        run: dbus-uuidgen --ensure=/etc/machine-id
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        id: dotnet
        with:
          global-json-file: global.json
      - name: Identify the native build environment
        id: native-sdk
        run: echo "digest=$(pacman -Q | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: fcitx-cache
        with:
          path: artifacts/ccache
          key: fcitx-ccache-${{ steps.native-sdk.outputs.digest }}-${{ hashFiles('eng/linux/cooperative/inputs.py', 'eng/linux/cooperative/fcitx.py', 'eng/linux/cooperative/patches/fcitx5.patch', 'eng/linux/cooperative/patches/fcitx5-chinese-addons.patch', 'eng/linux/cooperative/patches/fcitx5-gtk.patch') }}
          # ccache validates compiler content, flags and source/header hashes;
          # added unrelated SDK packages must not discard usable compile entries.
          restore-keys: |
            fcitx-ccache-${{ steps.native-sdk.outputs.digest }}-
            fcitx-ccache-
      - name: Restore the fixed Linux Hy CPU archive
        id: hy-cpu-cache
        timeout-minutes: 2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/linux/hy-cpu-download/
          key: typelay-hy-linux-cpu-${{ hashFiles('eng/linux/hy/runtime-archive.lock.json', 'src/shared/TypeLay.Worker/native/hy/cpu-runtime.lock.json') }}
      - name: Verify Linux Hy preparation contracts
        id: hy-preparation-contracts
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python tests/linux/test_hy_preparation.py -v
      - name: Prepare the fixed official Linux Hy CPU closure
        id: hy-cpu
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          python eng/linux/hy/prepare_runtime.py --cache artifacts/linux/hy-cpu-download --output artifacts/linux/hy-cpu-runtime
      - name: Verify Linux Hy runtime contracts
        id: hy-runtime-contracts
        if: ${{ !cancelled() && steps.hy-cpu.outcome == 'success' }}
        run: TYPELAY_HY_CPU_RUNTIME="$PWD/artifacts/linux/hy-cpu-runtime" python tests/linux/test_hy_runtime.py -v
      - name: Save only the verified Linux Hy CPU archive
        if: ${{ !cancelled() && steps.hy-cpu.outcome == 'success' && steps.hy-cpu-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 2
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/linux/hy-cpu-download/
          key: ${{ steps.hy-cpu-cache.outputs.cache-primary-key }}
      - name: Prepare fixed UI fonts for the Linux package
        id: fonts
