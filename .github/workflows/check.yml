        }}
      run: |
        export DISPLAY=:99
        python tests/linux/browser_e2e.py --chromium /usr/bin/chromium -v
    - name: Verify browser native messaging and document routing
      id: browser-native
      if: ${{ matrix.group == 'browser' && !cancelled() && steps.build.outcome == 'success' && steps.display.outcome == 'success'
        }}
      run: |
        export DISPLAY=:99
        python tests/linux/browser_native_e2e.py --package artifacts/linux/package --chromium /usr/bin/chromium -v
    - name: Probe source-owned VS Code edit transactions
      id: vscode-transactions
      if: ${{ matrix.group == 'browser' && !cancelled() && steps.display.outcome == 'success' }}
      run: |
        export DISPLAY=:99
        set -- /usr/lib/electron*/electron
        test "$#" -eq 1
        python tests/linux/vscode_e2e.py --code "$1" --app /usr/lib/code
    - name: Prepare the rich-editor browser fixture
      id: editor-fixture
      if: ${{ matrix.group == 'browser' && !cancelled() }}
      run: |
        mkdir -p artifacts/editor-probe
        cp tests/linux/fixtures/editor/package*.json artifacts/editor-probe/
        npm ci --prefix artifacts/editor-probe --ignore-scripts --no-audit --no-fund
        cp tests/linux/fixtures/editor/entry.js artifacts/editor-probe/
        timeout 30s node artifacts/editor-probe/node_modules/esbuild/bin/esbuild artifacts/editor-probe/entry.js --bundle --format=iife --outfile=artifacts/editor-probe/fixture.js
    - name: Probe real rich-editor transaction reentrancy
      id: editor-transactions
      if: ${{ matrix.group == 'browser' && !cancelled() && steps.editor-fixture.outcome == 'success' && steps.display.outcome
        == 'success' }}
      run: |
        export DISPLAY=:99
        python tests/linux/editor_probe.py --editor-bundle artifacts/editor-probe/fixture.js --chromium /usr/bin/chromium -v
    - name: Verify Firefox temporary extension and native messaging
      id: firefox-native
      if: ${{ matrix.group == 'browser' && !cancelled() && steps.build.outcome == 'success' && steps.display.outcome == 'success'
        && steps.editor-fixture.outcome == 'success' }}
      run: |
        export DISPLAY=:99
        python tests/linux/firefox_native_e2e.py --package artifacts/linux/package --firefox /usr/bin/firefox --geckodriver /usr/bin/geckodriver --editor-bundle artifacts/editor-probe/fixture.js -v
    - name: Probe real Fcitx client requests and candidate selection
      id: fcitx-client
      if: ${{ matrix.group == 'native' && !cancelled() && steps.build.outcome == 'success' }}
      run: python tests/linux/fcitx_probe.py
    - name: Verify isolated Fcitx and GTK cooperative transactions
      id: fcitx
      if: ${{ matrix.group == 'native' && !cancelled() && steps.build.outcome == 'success' && steps.fixed-native.outcome == 'success' }}
      run: python tests/linux/fcitx_cooperative/run.py --reuse-build --core-version 5.1.22 --core-ready-output "$GITHUB_OUTPUT"
    - name: Probe original Fcitx Qt input delivery boundaries
      id: qt
      if: ${{ matrix.group == 'native' && !cancelled() && steps.fcitx.outputs.core-ready == 'true' }}
      shell: bash
      run: |
        set -o pipefail
        python tests/linux/qt_cooperative/run.py --reuse-build --fcitx-root artifacts/linux/fcitx-cooperative-5.1.22 --verify-fcitx-build 2>&1 | tee artifacts/linux/qt-cooperative-probe.log
    - name: Package and relocate the optional Fcitx cooperation runtime
      id: fcitx-package
      if: ${{ matrix.group == 'native' && !cancelled() && (steps.fcitx.outcome == 'success' || steps.fcitx.outcome == 'failure')
        }}
      env:
        QT_PROBE_OUTCOME: ${{ steps.qt.outcome }}
      run: |
        set --
        if [ "$QT_PROBE_OUTCOME" = success ]; then
          set -- --qt-output artifacts/linux/qt-cooperative
        else
          echo "Qt probe did not pass; preserve its failure and collect independent GTK evidence."
        fi
        python packaging/linux/fcitx-cooperative/pack.py --build-output artifacts/linux/fcitx-cooperative-5.1.22 "$@" --output artifacts/TypeLay-Fcitx-cooperative.tar.gz --compression-level 1
        mkdir -p "artifacts/linux/relocated 输入法"
        tar -xzf artifacts/TypeLay-Fcitx-cooperative.tar.gz -C "artifacts/linux/relocated 输入法"
        # Match the user's profile-writing versions in this disposable container.
        # Keep normal package signatures and dependency validation enabled.
        mkdir -p artifacts/linux/target-packages
        cd artifacts/linux/target-packages
        curl --fail --location --output libime.pkg.tar.zst https://archive.archlinux.org/packages/l/libime/libime-1.1.16-1-x86_64.pkg.tar.zst
        curl --fail --location --output libime.pkg.tar.zst.sig https://archive.archlinux.org/packages/l/libime/libime-1.1.16-1-x86_64.pkg.tar.zst.sig
        curl --fail --location --output chinese.pkg.tar.zst https://archive.archlinux.org/packages/f/fcitx5-chinese-addons/fcitx5-chinese-addons-5.1.14-1-x86_64.pkg.tar.zst
        curl --fail --location --output chinese.pkg.tar.zst.sig https://archive.archlinux.org/packages/f/fcitx5-chinese-addons/fcitx5-chinese-addons-5.1.14-1-x86_64.pkg.tar.zst.sig
        printf '%s\n' "$LIBIME_PACKAGE_SHA256  libime.pkg.tar.zst" "$CHINESE_PACKAGE_SHA256  chinese.pkg.tar.zst" | sha256sum --check
        test -s libime.pkg.tar.zst.sig
        test -s chinese.pkg.tar.zst.sig
        pacman -U --noconfirm libime.pkg.tar.zst chinese.pkg.tar.zst
        test "$(pacman -Q libime)" = 'libime 1.1.16-1'
        test "$(pacman -Q fcitx5-chinese-addons)" = 'fcitx5-chinese-addons 5.1.14-1'
        echo 'packages-verified=true' >> "$GITHUB_OUTPUT"
        cd ../../..
        python "artifacts/linux/relocated 输入法/TypeLay-Fcitx-cooperative/fcitx-cooperative.py" preflight
    - name: Attach the matching desktop components to the main distribution
      id: complete-package
      if: ${{ matrix.group == 'native' && !cancelled() && steps.build.outcome == 'success' && steps.fcitx-package.outcome
        == 'success' && steps.qt.outcome == 'success' }}
      run: |
        python eng/linux/build.py --finalize --cooperation-package artifacts/TypeLay-Fcitx-cooperative.tar.gz
        TYPELAY_REQUIRE_HY_RUNTIME=1 TYPELAY_REQUIRE_DESKTOP_COMPONENT=1 TYPELAY_LINUX_PACKAGE="$PWD/artifacts/TypeLay-Linux-preview-x86_64.tar.gz" python tests/linux/distribution_e2e.py -v
    - name: Verify settings with the real local model
      id: settings
      if: ${{ matrix.group == 'settings' && !cancelled() && steps.models.outcome == 'success' && steps.display.outcome ==
        'success' }}
      run: |
        export DISPLAY=:99
        export XDG_CONFIG_HOME="$PWD/artifacts/linux/setup-settings-config"
        export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
        export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
        python tests/linux/native_e2e.py --desktop --desktop-scope setup-settings --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/setup-settings
    - name: Verify first-run tutorial with the real local model
      id: tutorial
      if: ${{ matrix.group == 'settings' && !cancelled() && steps.models.outcome == 'success' && steps.display.outcome ==
        'success' }}
      run: |
        export DISPLAY=:99
        export XDG_CONFIG_HOME="$PWD/artifacts/linux/setup-tutorial-config"
        export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
        export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
        python tests/linux/native_e2e.py --desktop --desktop-scope setup-tutorial --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/setup-tutorial
    - name: Exercise ordinary GIMP comments through shipped Settings
      id: gimp
      if: ${{ matrix.group == 'native' && !cancelled() && steps.models.outcome == 'success' && steps.complete-package.outcome
        == 'success' && steps.display.outcome == 'success' }}
      timeout-minutes: 6
      run: |
        export DISPLAY=:99
        export XDG_CONFIG_HOME="$PWD/artifacts/linux/ordinary-gimp-config"
        export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
        export XDG_CACHE_HOME="$PWD/artifacts/linux/ordinary-gimp-cache"
        python tests/linux/native_e2e.py --desktop --desktop-scope ordinary-gimp --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/ordinary-gimp
    - name: Exercise the production desktop and real browser input
      id: browser-desktop
      if: ${{ matrix.group == 'browser' && !cancelled() && steps.models.outcome == 'success' && steps.display.outcome == 'success'
        && steps.editor-fixture.outcome == 'success' }}
      run: |
        export DISPLAY=:99
        export XDG_CONFIG_HOME="$PWD/artifacts/linux/desktop-config"
        export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
        export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
        python tests/linux/native_e2e.py --desktop --desktop-scope browser --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/desktop --editor-bundle artifacts/editor-probe/fixture.js
    - name: Exercise relocated Fcitx and cooperative GTK with the real local model
      id: gtk-desktop
      if: ${{ matrix.group == 'native' && !cancelled() && steps.models.outcome == 'success' && steps.fcitx-package.outcome
        == 'success' && steps.display.outcome == 'success' }}
      run: |
        export DISPLAY=:99
        export XDG_CONFIG_HOME="$PWD/artifacts/linux/gtk-desktop-config"
        export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
        export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
        python tests/linux/native_e2e.py --desktop --desktop-scope gtk --gtk-session-bindings --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/gtk-desktop --fcitx-cooperative "artifacts/linux/relocated 输入法/TypeLay-Fcitx-cooperative"
    - name: Exercise cooperative GTK4 Entry with the real local model
      id: gtk4-desktop
      if: ${{ matrix.group == 'native' && !cancelled() && steps.models.outcome == 'success' && steps.fcitx-package.outcome
        == 'success' && steps.display.outcome == 'success' }}
      run: |
        export DISPLAY=:99
        export XDG_CONFIG_HOME="$PWD/artifacts/linux/gtk4-desktop-config"
        export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
        export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
        python tests/linux/native_e2e.py --desktop --desktop-scope gtk4 --gtk-session-bindings --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/gtk4-desktop --fcitx-cooperative "artifacts/linux/relocated 输入法/TypeLay-Fcitx-cooperative"
    - name: Exercise Qt6 widgets with explicit bundle or build provenance
      id: qt-desktop
      if: ${{ matrix.group == 'native' && !cancelled() && steps.models.outcome == 'success' && (steps.qt.outcome == 'success'
        || steps.qt.outcome == 'failure') && steps.fcitx-package.outcome == 'success' && steps.display.outcome == 'success'
        }}
      env:
        QT_PROBE_OUTCOME: ${{ steps.qt.outcome }}
      run: |
        export DISPLAY=:99
        export XDG_CONFIG_HOME="$PWD/artifacts/linux/qt-desktop-config"
        export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
        export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
        case "$QT_PROBE_OUTCOME" in
          success)
            fcitx_root="artifacts/linux/relocated 输入法/TypeLay-Fcitx-cooperative"
            ;;
          failure)
            fcitx_root=artifacts/linux/fcitx-cooperative-5.1.22
            python tests/linux/qt_cooperative/desktop_admission.py --probe-outcome "$QT_PROBE_OUTCOME" --fcitx-root "$fcitx_root" --qt-output artifacts/linux/qt-cooperative --output artifacts/linux/qt-desktop/qt-desktop-admission.json
            echo 'Qt probe remains failed. Qt desktop uses explicit unbundled build inputs, not distribution acceptance.' >> "$GITHUB_STEP_SUMMARY"
            ;;
          *) echo 'Qt desktop not run: probe outcome is neither success nor failure.'; exit 1 ;;
        esac
        python tests/linux/native_e2e.py --desktop --desktop-scope qt --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/qt-desktop --fcitx-cooperative "$fcitx_root" --qt-cooperative artifacts/linux/qt-cooperative
    - name: Verify installed VS Code command with the real local model
      id: vscode-model
      if: ${{ matrix.group == 'browser' && !cancelled() && steps.models.outcome == 'success' && steps.display.outcome == 'success'
        }}
      run: |
        export DISPLAY=:99
        set -- /usr/lib/electron*/electron
        test "$#" -eq 1
        python tests/linux/vscode_e2e.py --code "$1" --app /usr/lib/code --vsix "$PWD/artifacts/linux/package/vscode/typelay-editor.vsix" --code-cli /usr/bin/code --host "$PWD/artifacts/linux/package/typelay" --model-data "$PWD/artifacts/linux/desktop-data/typelay" --output artifacts/linux/vscode-model
    - name: Prepare and verify fixed Hy test data separately from the desktop
      id: hy-model-prepare
      if: ${{ matrix.group == 'settings' && !cancelled() && steps.models.outcome == 'success' }}
      timeout-minutes: 3
      run: |
        mkdir -p artifacts/linux/hy-package
        python tests/linux/hy_package_e2e.py --prepare-cache --package artifacts/linux/package --cache artifacts/linux/hy-model-cache > artifacts/linux/hy-package/cache-verification.json
    - name: Exercise formal Python and real GTK Hy install select return and remove
      id: hy-packages
      if: ${{ matrix.group == 'settings' && !cancelled() && steps.hy-model-prepare.outcome == 'success' && steps.display.outcome
        == 'success' }}
      timeout-minutes: 5
      run: |
        export DISPLAY=:99
        export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
        export XDG_CACHE_HOME="$PWD/artifacts/linux/hy-model-cache"
        python tests/linux/native_e2e.py --desktop --desktop-scope model-packages --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/hy-package
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: linux-${{ matrix.group }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          artifacts/ci/
          artifacts/linux/*.json
          artifacts/linux/*.log
          artifacts/linux/ordinary-gimp/
          artifacts/linux/browser-native/
          artifacts/linux/firefox-native/
          artifacts/linux/vscode/
          artifacts/linux/vscode-model/
          artifacts/linux/editor-probe/
          artifacts/linux/fcitx-probe/
          artifacts/linux/hy-package/
          artifacts/linux/setup-settings/
          artifacts/linux/setup-tutorial/
          artifacts/linux/desktop/
          artifacts/linux/gtk-desktop/
          artifacts/linux/gtk4-desktop/
          artifacts/linux/qt-desktop/
          artifacts/linux/qt-cooperative/*.json
          artifacts/linux/qt-cooperative/*.log
          artifacts/linux/fcitx-cooperative-5.1.22/*.json
          artifacts/linux/fcitx-cooperative-5.1.22/*.log
          artifacts/linux/fcitx-cooperative-5.1.22/gtk*-glossary-session/*.json
          artifacts/linux/fcitx-cooperative-5.1.22/gtk*-glossary-session/*.log
          artifacts/linux/desktop-data/typelay/components/*/self-check.json
        if-no-files-found: warn
        retention-days: 14
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: inputs.upload_packages && matrix.group == 'native'
      with:
        name: linux-package-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          artifacts/TypeLay-Linux-preview-x86_64.tar.gz
          artifacts/TypeLay-Fcitx-cooperative.tar.gz
        if-no-files-found: warn
        retention-days: 14
  linux-native:
    name: Linux / ${{ matrix.group }}
    needs: fonts
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    container: *linux-container
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group:
        - native
    env: *linux-sdk
    steps: *linux-steps
