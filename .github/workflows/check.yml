        run: |
          python - <<'PY'
          import json, os, stat
          from pathlib import Path
          source = Path('artifacts/linux/fcitx-cooperative-5.1.22')
          output = Path('artifacts/early-gtk4-glossary')
          output.mkdir(parents=True, exist_ok=False)
          names = ('gtk3-glossary-result.json', 'gtk4-glossary-result.json',
                   'gtk3-glossary-startup.json', 'gtk4-glossary-startup.json',
                   'gtk3-glossary-session/cleanup.json', 'gtk4-glossary-session/cleanup.json',
                   'gtk3-glossary-clicks.json', 'gtk4-glossary-clicks.json',
                   'gtk3-glossary.log', 'gtk4-glossary.log',
                   'gtk4-glossary-state.json', 'gtk4-glossary-niri.log')
          limit = 512 * 1024
          remaining = 6 * limit  # Preserve the original six-file aggregate ceiling.
          evidence = []
          for name in names:
              item = {'name': name}
              try:
                  path = source / name
                  info = path.lstat()
                  item['bytes'] = info.st_size
                  if not stat.S_ISREG(info.st_mode):
                      item['omitted'] = 'not-regular-file'
                  elif info.st_size > limit:
                      item['omitted'] = 'size-limit'
                  elif info.st_size > remaining:
                      item['omitted'] = 'total-size-limit'
                  else:
                      parent = os.open(path.parent, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
                      try:
                          descriptor = os.open(path.name, os.O_RDONLY | os.O_NOFOLLOW, dir_fd=parent)
                          with os.fdopen(descriptor, 'rb') as stream:
                              data = stream.read(limit + 1)
                      finally:
                          os.close(parent)
                      if len(data) > limit:
                          item['omitted'] = 'size-limit'
                      elif len(data) > remaining:
                          item['omitted'] = 'total-size-limit'
                      else:
                          (output / name).parent.mkdir(parents=True, exist_ok=True)
                          (output / name).write_bytes(data)
                          remaining -= len(data)
                          item['copiedBytes'] = len(data)
              except OSError as error:
                  item['omitted'] = type(error).__name__
              evidence.append(item)
          (output / 'manifest.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
