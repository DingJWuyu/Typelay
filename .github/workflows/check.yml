name: Windows checks
on:
  push:
    branches: [windows-preview]
  pull_request:
    branches: [windows-preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    env:
      DOTNET_INSTALL_DIR: /tmp/typelay-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify the portable baseline without Windows
        run: |
          dotnet test tests/behavior/TypeLay.Core.Tests -c Release -p:RestoreLockedMode=true --logger trx --results-directory artifacts/shared-test-results
          dotnet test tests/contracts/TypeLay.Protocol.Tests -c Release -p:RestoreLockedMode=true --logger trx --results-directory artifacts/shared-test-results
          PYTHONPATH=src/TypeLay.Worker python -m unittest discover -s tests/worker -v
      # Temporary source transfer for the isolated refactor workspace; removed with the refactor.
      - name: Export the exact source revision
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/typelay-source.tar.gz" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typelay-refactor-source-${{ github.sha }}
          path: ${{ runner.temp }}/typelay-source.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: typelay-shared-${{ github.sha }}
          path: artifacts/shared-test-results/
          if-no-files-found: warn
          retention-days: 14
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install developer tooling
        shell: pwsh
        run: |
          python -m pip install -r eng/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\Program Files\LLVM\bin' >> $env:GITHUB_PATH
      - name: Build, behavior regressions, contracts and formatting
        shell: pwsh
        run: ./dev.ps1 check
      - name: Package and test the relocated distribution
        shell: pwsh
        run: ./dev.ps1 pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: typelay-windows-${{ github.sha }}
          path: |
            artifacts/test-results/
            artifacts/TypeLay-Windows-preview.zip
            artifacts/TypeLay-Windows-preview.zip.sha256
          if-no-files-found: warn
          retention-days: 14
# Passing this job does not certify physical Tab, Chinese IME, visual parity or safe universal writeback.
