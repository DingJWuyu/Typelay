        run: python tests/linux/test_gtk_preview_contract.py -v
      - name: Verify Linux test_qt_candidate_observation
        id: test-qt-candidate-observation
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python tests/linux/test_qt_candidate_observation.py -v
      - name: Verify Linux test_argos_repetition_process
        id: test-argos-repetition-process
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python tests/linux/test_argos_repetition_process.py -v
      - name: Verify Linux test_index_package_diagnostics
        id: test-index-package-diagnostics
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python tests/linux/test_index_package_diagnostics.py -v
      - name: Verify Linux test_private_session_paths
        id: test-private-session-paths
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python tests/linux/test_private_session_paths.py -v
      - name: Verify Linux test_translation_quality_capture
        id: test-translation-quality-capture
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
