        with:
          path: artifacts/linux/target-packages
          key: arch-ime-x86_64-${{ env.LIBIME_PACKAGE_SHA256 }}-${{ env.CHINESE_PACKAGE_SHA256 }}
      - name: Package and relocate the optional Fcitx cooperation runtime
        id: fcitx-package
        # pack.py requires matching successful-build inputs. A later isolated
        # fixture failure stays red but must not hide the independent real
        # default-session deployment result for those same built components.
        if: ${{ !cancelled() && (steps.fcitx.outcome == 'success' || steps.fcitx.outcome == 'failure') }}
        env:
          QT_PROBE_OUTCOME: ${{ steps.qt.outcome }}
        run: |
          set --
          if [ "$QT_PROBE_OUTCOME" = success ]; then
            set -- --qt-output artifacts/linux/qt-cooperative
          else
            echo "Qt probe did not pass; preserve its failure and collect independent GTK evidence."
          fi
          python packaging/linux/fcitx-cooperative/pack.py --build-output artifacts/linux/fcitx-cooperative-5.1.22 "$@" --output artifacts/TypeLay-Fcitx-cooperative.tar.gz
          mkdir -p "artifacts/linux/relocated 输入法"
          tar -xzf artifacts/TypeLay-Fcitx-cooperative.tar.gz -C "artifacts/linux/relocated 输入法"
          # Match the user's profile-writing versions in this disposable container.
          # Keep normal package signatures and dependency validation enabled.
          mkdir -p artifacts/linux/target-packages
          cd artifacts/linux/target-packages
          if [ '${{ steps.ime-package-cache.outputs.cache-hit }}' != true ]; then
            curl --fail --location --output libime.pkg.tar.zst https://archive.archlinux.org/packages/l/libime/libime-1.1.16-1-x86_64.pkg.tar.zst
            curl --fail --location --output libime.pkg.tar.zst.sig https://archive.archlinux.org/packages/l/libime/libime-1.1.16-1-x86_64.pkg.tar.zst.sig
            curl --fail --location --output chinese.pkg.tar.zst https://archive.archlinux.org/packages/f/fcitx5-chinese-addons/fcitx5-chinese-addons-5.1.14-1-x86_64.pkg.tar.zst
            curl --fail --location --output chinese.pkg.tar.zst.sig https://archive.archlinux.org/packages/f/fcitx5-chinese-addons/fcitx5-chinese-addons-5.1.14-1-x86_64.pkg.tar.zst.sig
          fi
          printf '%s\n' "$LIBIME_PACKAGE_SHA256  libime.pkg.tar.zst" "$CHINESE_PACKAGE_SHA256  chinese.pkg.tar.zst" | sha256sum --check
          test -s libime.pkg.tar.zst.sig
          test -s chinese.pkg.tar.zst.sig
          pacman -U --noconfirm libime.pkg.tar.zst chinese.pkg.tar.zst
          test "$(pacman -Q libime)" = 'libime 1.1.16-1'
          test "$(pacman -Q fcitx5-chinese-addons)" = 'fcitx5-chinese-addons 5.1.14-1'
          echo 'packages-verified=true' >> "$GITHUB_OUTPUT"
          cd ../../..
          python "artifacts/linux/relocated 输入法/TypeLay-Fcitx-cooperative/fcitx-cooperative.py" preflight
      - name: Save the verified target input method packages
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.fcitx-package.outputs.packages-verified == 'true' && steps.ime-package-cache.outputs.cache-hit != 'true' }}
        with:
          path: artifacts/linux/target-packages
          key: ${{ steps.ime-package-cache.outputs.cache-primary-key }}
      - name: Attach the matching desktop components to the main distribution
        id: complete-package
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.fcitx-package.outcome == 'success' && steps.qt.outcome == 'success' }}
        run: |
          python eng/linux/build.py --finalize --cooperation-package artifacts/TypeLay-Fcitx-cooperative.tar.gz
          TYPELAY_REQUIRE_HY_RUNTIME=1 TYPELAY_REQUIRE_DESKTOP_COMPONENT=1 TYPELAY_LINUX_PACKAGE="$PWD/artifacts/TypeLay-Linux-preview-x86_64.tar.gz" python tests/linux/distribution_e2e.py -v
      - name: Install and verify actual local translation components
        id: models
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export XDG_CONFIG_HOME="$PWD/artifacts/linux/model-install-config"
          export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
          export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
          export XDG_RUNTIME_DIR="$PWD/artifacts/linux/model-install-runtime"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          artifacts/linux/package/typelay --install-models
      - name: Preserve bounded model activation failure metadata
        if: ${{ !cancelled() && steps.models.outcome == 'failure' }}
        run: |
          python - <<'PY_METADATA'
          import json, os, re, stat
          from pathlib import Path
          root = Path("artifacts/linux/desktop-data/typelay/components").absolute()
          def kind(path):
              try:
                  mode = path.lstat().st_mode
                  return "link" if stat.S_ISLNK(mode) else "directory" if stat.S_ISDIR(mode) else "file" if stat.S_ISREG(mode) else "other"
              except FileNotFoundError:
                  return "missing"
              except OSError:
                  return "unavailable"
          def small_json(path):
              try:
                  if kind(path) != "file" or path.stat().st_size > 4096:
                      return None
                  value = json.loads(path.read_text())
                  return value if isinstance(value, dict) else None
              except (OSError, ValueError):
                  return None
          def relative(path, base):
              try:
                  return str(Path(os.path.abspath(path)).relative_to(Path(os.path.abspath(base))))
              except ValueError:
                  return "outside-generation"
          report = {"currentKind": kind(root / "current"), "generations": []}
          if report["currentKind"] == "link":
              target = os.readlink(root / "current")
              report["currentTarget"] = target if re.fullmatch(r"[0-9a-f]{32}", target) else "invalid-target"
          generations = sorted(path for path in root.iterdir() if re.fullmatch(r"[0-9a-f]{32}", path.name) and kind(path) == "directory") if kind(root) == "directory" else []
          report["generationCount"] = len(generations)
          for generation in generations[:8]:
              activation = small_json(generation / "activation.json")
              check = small_json(generation / "self-check.json")
              item = {"id": generation.name, "activationKind": kind(generation / "activation.json"), "activationValidJson": activation is not None, "selfCheckPassed": bool(check and check.get("status") == "passed")}
              if activation:
                  item["schema"] = activation.get("schema") if type(activation.get("schema")) is int else "invalid"
                  previous = activation.get("previous")
                  item["previous"] = previous if previous is None or isinstance(previous, str) and re.fullmatch(r"[0-9a-f]{32}", previous) else "invalid"
              runtime = generation / "runtime"
              python = runtime / "venv/bin/python"
              item["pythonKind"] = kind(python)
              item["declaredParents"] = [{"path": relative(parent, runtime), "kind": kind(parent)} for parent in (runtime, runtime / "venv", runtime / "venv/bin")]
              try:
                  target = Path(os.readlink(python)) if python.is_symlink() else python
                  item["pythonLink"] = relative(target if target.is_absolute() else python.parent / target, runtime)
                  resolved = python.resolve(strict=True)
                  item["pythonResolved"] = relative(resolved, runtime)
                  item["parents"] = [{"path": relative(parent, runtime), "kind": kind(parent)} for parent in list(resolved.parents)[:12] if parent == runtime or parent.is_relative_to(runtime)]
              except (OSError, RuntimeError):
                  item["pythonResolution"] = "unavailable"
              report["generations"].append(item)
          Path("artifacts/linux/model-activation-metadata.json").write_text(json.dumps(report, indent=2))
          PY_METADATA
      # Independent scopes preserve both original contracts even when one fails.
      # Settings allows 360s, tutorial 240s; the Linux job/admission budgets stay fixed.
      - name: Verify settings with the real local model
        if: ${{ needs.scope.outputs.quality_only != 'true' && !cancelled() && steps.models.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          export XDG_CONFIG_HOME="$PWD/artifacts/linux/setup-settings-config"
          export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
          export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
          python tests/linux/native_e2e.py --desktop --desktop-scope setup-settings --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/setup-settings
      - name: Verify first-run tutorial with the real local model
        if: ${{ needs.scope.outputs.quality_only != 'true' && !cancelled() && steps.models.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          export XDG_CONFIG_HOME="$PWD/artifacts/linux/setup-tutorial-config"
          export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
          export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
          python tests/linux/native_e2e.py --desktop --desktop-scope setup-tutorial --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/setup-tutorial
      - name: Exercise ordinary GIMP comments through shipped Settings
        # Settings installs from the finalized main distribution, not the
        # independently packaged runtime. A missing prerequisite is not a GIMP run.
        if: ${{ needs.scope.outputs.quality_only != 'true' && needs.scope.outputs.practice != 'true' && !cancelled() && steps.models.outcome == 'success' && steps.complete-package.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          export DISPLAY=:99
          export XDG_CONFIG_HOME="$PWD/artifacts/linux/ordinary-gimp-config"
          export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
          export XDG_CACHE_HOME="$PWD/artifacts/linux/ordinary-gimp-cache"
          python tests/linux/native_e2e.py --desktop --desktop-scope ordinary-gimp --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/ordinary-gimp
      - name: Exercise the production desktop and real browser input
        if: ${{ needs.scope.outputs.quality_only != 'true' && needs.scope.outputs.practice != 'true' && !cancelled() && steps.models.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          export XDG_CONFIG_HOME="$PWD/artifacts/linux/desktop-config"
          export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
          export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
          python tests/linux/native_e2e.py --desktop --desktop-scope browser --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/desktop --editor-bundle artifacts/editor-probe/fixture.js
      - name: Exercise relocated Fcitx and cooperative GTK with the real local model
        if: ${{ needs.scope.outputs.quality_only != 'true' && needs.scope.outputs.practice != 'true' && !cancelled() && steps.models.outcome == 'success' && steps.fcitx-package.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          export XDG_CONFIG_HOME="$PWD/artifacts/linux/gtk-desktop-config"
          export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
          export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
          python tests/linux/native_e2e.py --desktop --desktop-scope gtk --gtk-session-bindings --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/gtk-desktop --fcitx-cooperative "artifacts/linux/relocated 输入法/TypeLay-Fcitx-cooperative"
      - name: Exercise cooperative GTK4 Entry with the real local model
        if: ${{ needs.scope.outputs.quality_only != 'true' && needs.scope.outputs.practice != 'true' && !cancelled() && steps.models.outcome == 'success' && steps.fcitx-package.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          export XDG_CONFIG_HOME="$PWD/artifacts/linux/gtk4-desktop-config"
          export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
          export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
          python tests/linux/native_e2e.py --desktop --desktop-scope gtk4 --gtk-session-bindings --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/gtk4-desktop --fcitx-cooperative "artifacts/linux/relocated 输入法/TypeLay-Fcitx-cooperative"
      - name: Exercise relocated Qt6 widgets with the real local model
        if: ${{ needs.scope.outputs.quality_only != 'true' && needs.scope.outputs.practice != 'true' && !cancelled() && steps.models.outcome == 'success' && steps.qt.outcome == 'success' && steps.fcitx-package.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          export XDG_CONFIG_HOME="$PWD/artifacts/linux/qt-desktop-config"
          export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
          export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
          python tests/linux/native_e2e.py --desktop --desktop-scope qt --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/qt-desktop --fcitx-cooperative "artifacts/linux/relocated 输入法/TypeLay-Fcitx-cooperative" --qt-cooperative artifacts/linux/qt-cooperative
      - name: Verify installed VS Code command with the real local model
        if: ${{ needs.scope.outputs.quality_only != 'true' && needs.scope.outputs.practice != 'true' && !cancelled() && steps.models.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          set -- /usr/lib/electron*/electron
          test "$#" -eq 1
          python tests/linux/vscode_e2e.py --code "$1" --app /usr/lib/code --vsix "$PWD/artifacts/linux/package/vscode/typelay-editor.vsix" --code-cli /usr/bin/code --host "$PWD/artifacts/linux/package/typelay" --model-data "$PWD/artifacts/linux/desktop-data/typelay" --output artifacts/linux/vscode-model
      # All existing Argos/browser/native consumers finish before this single
      # model-package lifecycle. The original model and product deadlines stay fixed.
      - name: Admit the bounded formal Hy package lifecycle
        id: hy-admission
        if: ${{ needs.scope.outputs.practice != 'true' && !cancelled() && steps.models.outcome == 'success' && steps.complete-package.outcome == 'success' }}
        env:
          PYTHONDONTWRITEBYTECODE: ${{ needs.scope.outputs.collect_quality == 'true' && '1' || '' }}
        run: |
          mkdir -p artifacts/linux/hy-package
          set --
          if [ "$TYPELAY_COLLECT_TRANSLATION_QUALITY" = true ]; then
            set -- --collect-translation-quality
            if [ "$TYPELAY_COMBINATION_ONLY" = true ]; then
              set -- "$@" --combination-only
            fi
          fi
          remaining=$((TYPELAY_LINUX_CHECK_SECONDS - $(date +%s) + TYPELAY_LINUX_CHECK_START))
          python tests/linux/hy_package_e2e.py --check-budget --package artifacts/linux/package --data artifacts/linux/desktop-data --remaining-seconds "$remaining" "$@" > artifacts/linux/hy-package/admission.json
      - name: Restore the independently pinned Linux Hy model cache
        id: hy-model-cache
        if: ${{ !cancelled() && steps.hy-admission.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/linux/hy-model-cache/typelay/components/hy-mt2-1-8b-q4-k-m/
          key: typelay-hy-linux-model-${{ hashFiles('src/shared/TypeLay.Worker/native/hy/model.lock.json') }}
      - name: Prepare and verify fixed Hy test data separately from the desktop
        id: hy-model-prepare
        if: ${{ !cancelled() && steps.hy-model-cache.outcome == 'success' }}
        timeout-minutes: 3
        env:
          PYTHONDONTWRITEBYTECODE: ${{ needs.scope.outputs.collect_quality == 'true' && '1' || '' }}
        run: |
          set --
          if [ "$FIXED_MODEL_DIAGNOSTICS" = true ] || [ "$TYPELAY_COMBINATION_ONLY" = true ] || [ "$HY_DECODE_COMPARISON" = true ]; then
            set -- --cache-only
          fi
          if [ "$HY_DECODE_COMPARISON" = true ]; then
            set +e
            PYTHONPATH=src/shared/TypeLay.Worker python tests/shared/worker/ordinary_quality.py --decode-comparison --validate-only --output artifacts/linux/quality-plan/ordinary-quality.json
            plan_status=$?
            set -e
            test "$plan_status" -eq 2
            python -c 'import json,pathlib; reports=[json.loads(p.read_text()) for p in pathlib.Path("artifacts/linux/quality-plan").glob("*.json")]; assert len(reports)==2 and all(r["status"]=="not-run" and r["workerStarts"]==0 for r in reports)'
          fi
          python tests/linux/hy_package_e2e.py --prepare-cache --package artifacts/linux/package --cache artifacts/linux/hy-model-cache "$@" > artifacts/linux/hy-package/cache-verification.json
      - name: Save only fully verified Hy test model data
        if: ${{ !cancelled() && steps.hy-model-prepare.outcome == 'success' && steps.hy-model-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 2
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/linux/hy-model-cache/typelay/components/hy-mt2-1-8b-q4-k-m/
          key: ${{ steps.hy-model-cache.outputs.cache-primary-key }}
      - name: Exercise formal Python and real GTK Hy install select return and remove
        if: ${{ !cancelled() && steps.hy-model-prepare.outcome == 'success' }}
        timeout-minutes: ${{ needs.scope.outputs.collect_quality == 'true' && 36 || 5 }}
        env:
          HY_DECODE_COMPARISON: ${{ needs.scope.outputs.hy_decode_comparison }}
        run: |
          export DISPLAY=:99
          export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
          export XDG_CACHE_HOME="$PWD/artifacts/linux/hy-model-cache"
          set --
          output=artifacts/linux/hy-package
          if [ "$TYPELAY_COLLECT_TRANSLATION_QUALITY" = true ]; then
            set -- --collect-translation-quality
            if [ "$TYPELAY_COMBINATION_ONLY" = true ]; then
              set -- "$@" --combination-only
            fi
            output=artifacts/linux/quality-capture
          fi
          if [ "$FIXED_MODEL_DIAGNOSTICS" = true ]; then
            set -- "$@" --fixed-model-diagnostics
          fi
          if [ "$HY_DECODE_COMPARISON" = true ]; then
            set -- "$@" --hy-decode-comparison
          fi
          python tests/linux/native_e2e.py --desktop --desktop-scope model-packages --package artifacts/linux/package --native artifacts/linux/native --output "$output" "$@"
          if [ "$TYPELAY_COLLECT_TRANSLATION_QUALITY" = true ]; then
            printf '%s\n' 'Fixed translation responses collected: quality remains not-reviewed. This is not language-quality acceptance.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: typelay-linux-${{ github.sha }}
          path: |
            artifacts/linux/nested/
            artifacts/linux/desktop/
            artifacts/linux/gtk-desktop/
            artifacts/linux/qt-desktop/
            artifacts/linux/gtk4-desktop/
            artifacts/linux/setup-settings/
