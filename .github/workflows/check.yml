            artifacts/linux/qt-cooperative/*.log
            artifacts/linux/fcitx-cooperative-5.1.22/*.json
            artifacts/linux/fcitx-cooperative-5.1.22/*.log
            artifacts/linux/fcitx-cooperative-5.1.22/gtk*-glossary-session/*.json
            artifacts/linux/fcitx-cooperative-5.1.22/gtk*-glossary-session/*.log
            ${{ steps.complete-package.outcome != 'success' && 'artifacts/TypeLay-Fcitx-cooperative.tar.gz' || '' }}
            artifacts/linux/desktop-data/typelay/components/*/self-check.json
            artifacts/linux/model-activation-metadata.json
            artifacts/linux/hy-package/*.json
            artifacts/linux/hy-package/*.log
            artifacts/linux/hy-package/*.png
            artifacts/linux/quality-plan/*.json
            artifacts/linux/quality-capture/*.json
            artifacts/linux/quality-capture/*.log
            artifacts/linux/quality-capture/*.png
            artifacts/linux/quality-capture/ordinary-hy-decode/build.json
            artifacts/linux/quality-capture/ordinary-hy-decode/build.log
            artifacts/linux/native/libtypelay-gtk3.so
            artifacts/linux/native/typelay-supervise
            artifacts/TypeLay-Linux-preview-x86_64.tar.gz
            artifacts/TypeLay-Linux-preview-x86_64.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 14
# Passing this job does not certify physical Tab, Chinese IME, visual parity or safe universal writeback.

  qt-iteration:
    name: Linux Qt iteration (not full product acceptance)
    needs: scope
    if: needs.scope.outputs.qt == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --shm-size=1g
    timeout-minutes: 15
    env:
      TYPELAY_EXPECT_QT_VERSION: 6.11.2
    permissions:
      contents: read
      actions: read
    steps:
      - name: Install isolated Qt iteration dependencies
        run: pacman -Syu --noconfirm git cmake ninja pkgconf python curl unzip patch extra-cmake-modules libxkbcommon libxcb fcitx5 boost-libs opencc xorg-server-xvfb xdotool dbus gtk3 python-gobject libayatana-appindicator niri mesa grim noto-fonts-cjk uv icu openssl zlib
      - name: Match the target Qt upstream ABI
        run: |
          mkdir -p /tmp/typelay-target-sdk
          cd /tmp/typelay-target-sdk
          package='qt6-base-6.11.2-3-x86_64.pkg.tar.zst'
          curl --fail --location "https://archive.archlinux.org/packages/q/qt6-base/$package" -o "$package"
          curl --fail --location "https://archive.archlinux.org/packages/q/qt6-base/$package.sig" -o "$package.sig"
          echo '257c5ef6180119d5b4365bdfe2a2ad051694b5dff390eac8e736dd78b8107b21  qt6-base-6.11.2-3-x86_64.pkg.tar.zst' | sha256sum -c -
          echo 'abf939ab10c2d7f28af81e5230c72e2acbd803fe43590fda331f474ec871dcfb  qt6-base-6.11.2-3-x86_64.pkg.tar.zst.sig' | sha256sum -c -
          pacman -U --noconfirm "./$package"
          test "$(pkg-config --modversion Qt6Core)" = 6.11.2
          test -f /usr/lib/qt6/plugins/platforms/libqwayland.so
      - name: Initialize the disposable container D-Bus identity
        run: dbus-uuidgen --ensure=/etc/machine-id
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reuse the exact verified cooperation runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/qt-runtime artifacts/qt-probe-root
          curl --fail --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/DingJWuyu/Typelay/actions/artifacts/11797631952/zip \
            -o artifacts/qt-runtime/evidence.zip
          echo '3bf7bf2ebc650efd80f16073a1792633cabdfce45478888d0dadab39a815fa35  artifacts/qt-runtime/evidence.zip' | sha256sum -c -
          unzip -p artifacts/qt-runtime/evidence.zip TypeLay-Fcitx-cooperative.tar.gz > artifacts/qt-runtime/runtime.tar.gz
          echo 'afe4f71d8e7476eec1f48ed1c041a5f6f6a4191de66299b58f63a8e9fc5083ac  artifacts/qt-runtime/runtime.tar.gz' | sha256sum -c -
          tar -xzf artifacts/qt-runtime/runtime.tar.gz -C artifacts/qt-runtime
          unzip -p artifacts/qt-runtime/evidence.zip TypeLay-Linux-preview-x86_64.tar.gz > artifacts/qt-runtime/client.tar.gz
          echo '23562c9f82ab9be9a4966978d61c600b3c74d4f07f91e80af0f0400ef6fe190a  artifacts/qt-runtime/client.tar.gz' | sha256sum -c -
          tar -xzf artifacts/qt-runtime/client.tar.gz -C artifacts/qt-runtime
          prefix="$PWD/artifacts/qt-runtime/TypeLay-Fcitx-cooperative/core"
          ln -s "$prefix/bin/fcitx5" artifacts/qt-probe-root/fcitx5
          ln -s "$prefix" artifacts/qt-probe-root/core-prefix
          ln -s "$prefix/lib/fcitx5" artifacts/qt-probe-root/lib
          printf '%s\n' 'sourceCommit=d607db1b8a3fc882cfd4a9c19a6e454d9b610189' 'artifactId=11797631952' > artifacts/qt-runtime/provenance.txt
      - name: Probe the original Qt input path
        run: python tests/linux/qt_cooperative/run.py --fcitx-root artifacts/qt-probe-root
      - name: Install the same real local model for the isolated adapter scenario
        run: |
          mkdir -p artifacts/linux/desktop-data artifacts/linux/desktop-cache
          python artifacts/qt-runtime/TypeLay-Linux-preview/desktop/setup.py "$PWD/artifacts/qt-runtime/TypeLay-Linux-preview" "$PWD/artifacts/linux/desktop-data/typelay" "$PWD/artifacts/linux/desktop-cache/typelay"
      - name: Exercise the current adapter with the fixed production client
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 > artifacts/qt-runtime/xvfb.log 2>&1 &
          xvfb=$!
          trap 'kill "$xvfb" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            if xdotool getdisplaygeometry >/dev/null 2>&1; then break; fi
            kill -0 "$xvfb"
            sleep 0.05
          done
          xdotool getdisplaygeometry
          export XDG_CONFIG_HOME="$PWD/artifacts/linux/qt-desktop-config"
