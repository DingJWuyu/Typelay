      GTK4_SIGNATURE_SHA256: 894fd81f845eb49137d73056f62b27f2d194d2990ebe6dfdc956cd678db76048
      QT_PACKAGE_SHA256: 257c5ef6180119d5b4365bdfe2a2ad051694b5dff390eac8e736dd78b8107b21
      QT_SIGNATURE_SHA256: abf939ab10c2d7f28af81e5230c72e2acbd803fe43590fda331f474ec871dcfb
