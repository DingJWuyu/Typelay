name: TypeLay checks
'on':
  push:
    branches-ignore:
    - main
    - trunk
  workflow_dispatch:
    inputs:
      upload_packages:
        description: Upload distribution packages for final acceptance
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: typelay-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fonts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: typelay-fixed-fonts
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.key.outputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Hash fixed font inputs
      run: echo "tag=$(python eng/ci/fixed.py key fonts)" >> "$GITHUB_OUTPUT"
      id: key
    - name: Restore fixed UI font build
      run: python eng/ci/fixed.py restore fonts --tag "$TAG"
      id: restore
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.key.outputs.tag }}
    - name: Build UI fonts once per input hash
      run: |-
        python -m pip install -r eng/requirements.txt
        python eng/fonts/prepare.py
      if: steps.restore.outputs.hit != 'true'
    - name: Verify UI font bytes
      run: python eng/fonts/prepare.py --verify
    - name: Publish fixed UI font build
      run: python eng/ci/fixed.py publish fonts --tag "$TAG"
      if: steps.restore.outputs.hit != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.key.outputs.tag }}
  fcitx-build:
    runs-on: ubuntu-latest
    container: &linux-container
      image: archlinux:base-devel
      options: --shm-size=1g
    permissions:
      contents: write
    concurrency:
      group: typelay-fixed-fcitx
      cancel-in-progress: false
    steps:
    - name: Install checkout prerequisite
      run: pacman -Sy --noconfirm git
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/linux-tools
      with:
        desktop: 'false'
    - &tested-source
      name: Record tested commit
      run: |
        python - <<'PY_SOURCE'
        import json, os, subprocess
        from pathlib import Path
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
        source = {
            "tested_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
            "event": os.environ["GITHUB_EVENT_NAME"],
            "ref": os.environ["GITHUB_REF"],
            "created": event.get("created"),
            "before": event.get("before"),
            "run_id": os.environ["GITHUB_RUN_ID"],
            "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
        }
        Path("artifacts/ci").mkdir(parents=True, exist_ok=True)
        Path("artifacts/ci/source.json").write_text(json.dumps(source, indent=2), encoding="utf-8")
        PY_SOURCE
      shell: bash
    - name: Hash fixed Hy download identities
      run: echo "tag=$(python eng/ci/fixed.py key hy)" >> "$GITHUB_OUTPUT"
      id: hy-key
    - name: Find fixed Hy downloads
      run: python eng/ci/fixed.py lookup hy --tag "$TAG"
      id: hy-cache
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.hy-key.outputs.tag }}
    - name: Prepare fixed Hy downloads without installing or running a model
      if: steps.hy-cache.outputs.hit != 'true'
      run: python eng/windows/hy/prepare_assets.py --artifacts "$PWD/artifacts" --budget-seconds 590 --assets-only
    - name: Publish fixed Hy downloads
      if: steps.hy-cache.outputs.hit != 'true'
      run: python eng/ci/fixed.py publish hy --tag "$TAG"
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.hy-key.outputs.tag }}
    - name: Find fixed Index downloads
      run: python eng/ci/fixed.py lookup index
      id: index-cache
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Prepare fixed Index downloads
      if: steps.index-cache.outputs.hit != 'true'
      run: python eng/shared/prepare_index_model.py --output artifacts/index-model-download
    - name: Publish fixed Index downloads
      if: steps.index-cache.outputs.hit != 'true'
      run: python eng/ci/fixed.py publish index
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Hash pinned third-party sources and toolchain
      run: echo "tag=$(python eng/ci/fixed.py key fcitx)" >> "$GITHUB_OUTPUT"
      id: key
    - name: Find fixed Fcitx build
      run: python eng/ci/fixed.py lookup fcitx --tag "$TAG"
      id: restore
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.key.outputs.tag }}
    - name: Build pinned third-party Fcitx dependencies
      run: python eng/linux/cooperative/third_party.py
      if: steps.restore.outputs.hit != 'true'
    - name: Publish fixed Fcitx build
      run: python eng/ci/fixed.py publish fcitx --tag "$TAG"
      if: steps.restore.outputs.hit != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.key.outputs.tag }}
  shared:
    name: shared
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      id: checkout
      with:
        persist-credentials: false
    - *tested-source
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      with:
        global-json-file: global.json
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      id: python
      if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      with:
        python-version: '3.13'
    - name: Install repository Python tools
      id: python-tools
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python -m pip install -r eng/requirements.txt
    - name: Check repository Python lint
      id: python-lint
      if: ${{ !cancelled() && steps.python-tools.outcome == 'success' }}
      run: python -m ruff check .
    - name: Check repository Python formatting
      id: python-format
      if: ${{ !cancelled() && steps.python-tools.outcome == 'success' }}
      run: python -m ruff format --check --diff .
    - name: Verify Linux input feedback contracts
      id: input-feedback
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python tests/linux/input_feedback.py -v
    - name: Verify offline verification isolation and cache ownership
      id: verification-resources
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      # Preserve #37's host-only namespace test and restore the runner policy.
      run: |
        namespace_policy=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
        trap 'sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns="$namespace_policy"' EXIT
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        python tests/linux/test_verification_resources.py -v
    - name: Verify shared behavior without Windows
      id: shared-behavior
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      shell: pwsh
      run: ./dev.ps1 shared-check
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: shared-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          artifacts/shared-test-results/
          artifacts/ci/
        if-no-files-found: warn
        retention-days: 14
  windows-contracts:
    name: Windows contracts / ${{ matrix.shard }}
    needs: fonts
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - uses: ./.github/actions/fonts
      with:
        tag: ${{ needs.fonts.outputs.tag }}
        token: ${{ github.token }}
    - name: Install pinned developer tools
      run: |-
        python -m pip install -r eng/requirements.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        'C:\Program Files\LLVM\bin' >> $env:GITHUB_PATH
      shell: pwsh
    - *tested-source
    - name: Build the Windows workspace
      id: windows-build
      shell: pwsh
      run: ./dev.ps1 build
    - name: Verify Windows behavior and contracts
      id: windows-contracts
      if: success()
      shell: pwsh
      env:
        TYPELAY_TRACE: ${{ github.workspace }}/artifacts/controller-trace.jsonl
      run: python eng/windows/test_contracts.py --shard ${{ matrix.shard }} --configuration Release --results-directory artifacts/test-results
    - name: Package and smoke the isolated physical Tab handoff
      id: physical-tab-package
      if: ${{ !cancelled() && matrix.shard == 2 && steps.windows-build.outcome == 'success' }}
      timeout-minutes: 2
      shell: pwsh
      run: python eng/windows/package-physical-tab.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: windows-contracts-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          artifacts/test-results/
          artifacts/ci/
          artifacts/physical-tab-package/
        if-no-files-found: warn
        retention-days: 14
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: inputs.upload_packages && matrix.shard == 2
      with:
        name: windows-physical-tab-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          artifacts/TypeLay-Windows-physical-Tab-validation.zip
          artifacts/TypeLay-Windows-physical-Tab-validation.zip.sha256
        if-no-files-found: warn
        retention-days: 14
  windows-tools:
    needs: fonts
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - uses: ./.github/actions/fonts
      with:
        tag: ${{ needs.fonts.outputs.tag }}
        token: ${{ github.token }}
    - name: Install pinned developer tools
      run: |-
        python -m pip install -r eng/requirements.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        'C:\Program Files\LLVM\bin' >> $env:GITHUB_PATH
      shell: pwsh
    - *tested-source
    - name: Build the Windows workspace
      id: windows-build
      shell: pwsh
      run: ./dev.ps1 build
    - name: Verify the Windows contract runner
      id: windows-contract-runner
      if: ${{ !cancelled() }}
      shell: pwsh
      run: python -m unittest discover -s tests/windows -p test_contract_runner.py -v
    - name: Verify Windows workspace formatting
      id: windows-format
      if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
      shell: pwsh
      run: dotnet format TypeLay.slnx --verify-no-changes --no-restore
    - name: Verify worker behavior on Windows
      id: windows-worker
      if: ${{ !cancelled() }}
      shell: pwsh
      env:
        PYTHONPATH: ${{ github.workspace }}/src/shared/TypeLay.Worker
      run: |
        python -m unittest discover -s tests/shared/worker -v
        exit $LASTEXITCODE
    - name: Verify the controlled native adapter
      id: windows-native
      if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
      shell: pwsh
      run: ./dev.ps1 native-e2e
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: windows-tools-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          artifacts/ci/
          artifacts/physical-tab*/
        if-no-files-found: warn
        retention-days: 14
  windows-desktop:
    name: Windows desktop / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [ordinary, hy]
    needs: fonts
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - uses: ./.github/actions/fonts
      with:
        tag: ${{ needs.fonts.outputs.tag }}
        token: ${{ github.token }}
    - name: Install pinned developer tools
      run: |-
        python -m pip install -r eng/requirements.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        'C:\Program Files\LLVM\bin' >> $env:GITHUB_PATH
      shell: pwsh
    - *tested-source
    - name: Build the desktop and native fixtures
      id: windows-build
      shell: pwsh
      run: |
        dotnet build tests/windows/fixtures/TypeLay.DesktopFixture -c Release -p:RestoreLockedMode=true -warnaserror
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet build tests/windows/fixtures/TypeLay.NativeFixture -c Release -p:RestoreLockedMode=true -warnaserror
        exit $LASTEXITCODE
    - name: Prepare fixed Hy assets without an audit adapter
      id: hy-prepare
      if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
      timeout-minutes: 10
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python eng/ci/fixed.py restore hy --wait-for-job fcitx-build
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ./dev.ps1 hy-product-prepare
    - name: Package and test the relocated distribution
      id: windows-package
      if: ${{ !cancelled() && steps.windows-build.outcome == 'success' && steps.hy-prepare.outcome == 'success' }}
      shell: pwsh
      env:
        TYPELAY_BROWSER_REGISTRATION_E2E: '1'
        TYPELAY_HY_WINDOWS_CPU_RUNTIME: artifacts/hy-runtime
      run: ./dev.ps1 pack -HyRuntime artifacts/hy-runtime
    - name: Verify continuous translation with the real local model
      id: windows-continuous
      if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
      timeout-minutes: 25
      shell: pwsh
      run: |
        dotnet tests/windows/fixtures/TypeLay.DesktopFixture/bin/Release/net10.0-windows/TypeLay.DesktopFixture.dll --verify-continuous artifacts/continuous-translation src/shared/TypeLay.Worker/run_worker.py tests/windows/fixtures/TypeLay.NativeFixture/bin/Release/net10.0/TypeLay.NativeFixture.dll
        exit $LASTEXITCODE
    - name: Verify and prepare Chrome for Testing for the cooperative product path
      if: ${{ matrix.group == 'ordinary' && !cancelled() && steps.windows-build.outcome == 'success' }}
      id: cooperative-browser-prepare
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $pin = Get-Content tests/windows/support/chrome-for-testing.json -Raw | ConvertFrom-Json
        $archive = Join-Path $PWD 'artifacts/browser-download/chrome-win64.zip'
        New-Item -ItemType Directory -Path (Split-Path $archive) -Force | Out-Null
        if (-not (Test-Path -LiteralPath $archive)) {
          Invoke-WebRequest -Uri $pin.archiveUrl -OutFile $archive -TimeoutSec 180
        }
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.archiveSha256) {
          throw 'Chrome for Testing archive SHA-256 mismatch.'
        }
        Expand-Archive -LiteralPath $archive -DestinationPath artifacts/cooperative-browser
        $chrome = Join-Path $PWD 'artifacts/cooperative-browser/chrome-win64/chrome.exe'
        $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($chrome)
        if ($version.ProductVersion -ne $pin.version -or $version.ProductName -ne 'Google Chrome for Testing') {
          throw 'Chrome for Testing product/version mismatch.'
        }
        "chrome=$chrome" >> $env:GITHUB_OUTPUT
    - name: Verify cooperative browser input with the shipped app and real model
      id: windows-browser
      if: ${{ matrix.group == 'ordinary' && !cancelled() && steps.windows-package.outcome == 'success' && steps.cooperative-browser-prepare.outcome == 'success'
        }}
      timeout-minutes: 10
      shell: pwsh
      env:
        TYPELAY_BROWSER_REGISTRATION_E2E: '1'
        TYPELAY_HOSTED_EMPTY_BROWSER_CONTAINER_E2E: ${{ runner.environment == 'github-hosted' && '1' || '0' }}
      run: |
        python eng/windows/observe-browser-profile.py --stage before-browser-cooperation --output artifacts/browser-profile/before-browser-cooperation.json
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet tests/windows/fixtures/TypeLay.DesktopFixture/bin/Release/net10.0-windows/TypeLay.DesktopFixture.dll --verify-browser-cooperation artifacts/browser-cooperation artifacts/package/TypeLay '${{ steps.cooperative-browser-prepare.outputs.chrome }}'
        exit $LASTEXITCODE
    - name: Verify prior model consumers have exited before Notepad
      id: notepad-consumer-exit
      if: ${{ matrix.group == 'ordinary' && !cancelled() && steps.windows-package.outcome == 'success' && (steps.windows-browser.outcome == 'success' ||
        steps.windows-browser.outcome == 'failure') }}
      shell: pwsh
      env:
        CONTINUOUS_NONCE: ${{ steps.windows-continuous.outputs.consumer_exit_nonce }}
        BROWSER_NONCE: ${{ steps.windows-browser.outputs.consumer_exit_nonce }}
        WORKFLOW_CANCELLED: ${{ job.status != 'success' && job.status != 'failure' }}
      run: |
        $ErrorActionPreference = 'Stop'
        # Business failure stays red; neither prior consumer may still be active.
        python eng/windows/verify-consumer-exit.py --scope before-notepad --continuous-proof artifacts/continuous-translation/consumer-exit.json --browser-proof artifacts/browser-cooperation/consumer-exit.json --continuous-nonce "$env:CONTINUOUS_NONCE" --browser-nonce "$env:BROWSER_NONCE" --run-id "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT" --head "$env:GITHUB_SHA" --workflow-cancelled "$env:WORKFLOW_CANCELLED"
        exit $LASTEXITCODE
    - name: Verify real classic Notepad through shipped app Settings
      id: windows-ordinary-notepad
      if: ${{ matrix.group == 'ordinary' && !cancelled() && steps.notepad-consumer-exit.outcome == 'success' }}
      timeout-minutes: 10
      shell: pwsh
      run: |
        ./dev.ps1 package-e2e -Scenario ordinary-notepad
        exit $LASTEXITCODE
    - name: Verify all prior model consumers have exited
      id: hy-consumer-exit
      if: ${{ matrix.group == 'ordinary' && !cancelled() && steps.windows-package.outcome == 'success' }}
      shell: pwsh
      env:
        CONTINUOUS_NONCE: ${{ steps.windows-continuous.outputs.consumer_exit_nonce }}
        BROWSER_NONCE: ${{ steps.windows-browser.outputs.consumer_exit_nonce }}
        NOTEPAD_NONCE: ${{ steps.windows-ordinary-notepad.outputs.consumer_exit_nonce }}
        WORKFLOW_CANCELLED: ${{ job.status != 'success' && job.status != 'failure' }}
      run: |
        python eng/windows/verify-consumer-exit.py --continuous-proof artifacts/continuous-translation/consumer-exit.json --browser-proof artifacts/browser-cooperation/consumer-exit.json --notepad-proof artifacts/ordinary-notepad/consumer-exit.json --continuous-nonce "$env:CONTINUOUS_NONCE" --browser-nonce "$env:BROWSER_NONCE" --notepad-nonce "$env:NOTEPAD_NONCE" --run-id "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT" --head "$env:GITHUB_SHA" --workflow-cancelled "$env:WORKFLOW_CANCELLED"
        exit $LASTEXITCODE
    - name: Verify the isolated Hy job's prior consumer has exited
      id: hy-isolated-exit
      if: ${{ matrix.group == 'hy' && !cancelled() && steps.windows-package.outcome == 'success' }}
      shell: pwsh
      env:
        CONTINUOUS_NONCE: ${{ steps.windows-continuous.outputs.consumer_exit_nonce }}
        WORKFLOW_CANCELLED: ${{ job.status != 'success' && job.status != 'failure' }}
      run: |
        python eng/windows/verify-consumer-exit.py --scope continuous-only --continuous-proof artifacts/continuous-translation/consumer-exit.json --continuous-nonce "$env:CONTINUOUS_NONCE" --run-id "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT" --head "$env:GITHUB_SHA" --workflow-cancelled "$env:WORKFLOW_CANCELLED"
        exit $LASTEXITCODE
    - name: Verify the shipped Hy ABI5 worker and production process owner
      id: hy-production
      if: ${{ matrix.group == 'hy' && !cancelled() && steps.windows-package.outcome == 'success' && steps.hy-isolated-exit.outcome == 'success' }}
      timeout-minutes: 6
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        ./dev.ps1 package-e2e -Scenario hy-production
        exit $LASTEXITCODE
    - name: Verify Hy install select preview and remove through Settings
      id: hy-packages
      if: ${{ matrix.group == 'hy' && !cancelled() && steps.windows-package.outcome == 'success' && steps.hy-production.outcome == 'success' }}
      timeout-minutes: 16
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        ./dev.ps1 package-e2e -Scenario hy-packages
        exit $LASTEXITCODE
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: windows-desktop-${{ matrix.group }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          artifacts/ci/
          artifacts/continuous-translation/*.json
          artifacts/continuous-translation/trace*.jsonl
          artifacts/browser-cooperation/*.json
          artifacts/browser-cooperation/trace*.jsonl
          artifacts/ordinary-notepad/*.json
          artifacts/ordinary-notepad/trace*.jsonl
          artifacts/browser-profile/*.json
          artifacts/hy-results/*.json
          artifacts/hy-results/*.stderr
          artifacts/hy-production/*.json
          artifacts/hy-packages/*.json
          artifacts/hy-packages/*.png
          artifacts/hy-packages/trace*.jsonl
        if-no-files-found: warn
        retention-days: 14
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: inputs.upload_packages && matrix.group == 'hy'
      with:
        name: windows-package-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          artifacts/TypeLay-Windows-preview.zip
          artifacts/TypeLay-Windows-preview.zip.sha256
        if-no-files-found: warn
        retention-days: 14
  index-windows:
    name: Index / windows
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - *tested-source
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: ./.github/actions/fonts
      with:
        tag: ${{ needs.fonts.outputs.tag }}
        token: ${{ github.token }}
    - name: Install pinned build dependencies
      shell: pwsh
      run: |
        python -m pip install -r eng/requirements.txt
        exit $LASTEXITCODE
    - name: Prepare and verify official Index model and CPU closure
      timeout-minutes: 10
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python eng/ci/fixed.py restore index --wait-for-job fcitx-build
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python eng/windows/index/prepare_runtime.py --cache artifacts/index-runtime-download --output artifacts/index-runtime
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python eng/shared/prepare_index_model.py --output artifacts/index-model-download
        exit $LASTEXITCODE
    - name: Build the actual distribution and production fixture
      id: index-package
      timeout-minutes: 10
      shell: pwsh
      run: |
        ./dev.ps1 pack -IndexRuntime artifacts/index-runtime
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet build tests/windows/fixtures/TypeLay.DesktopFixture -c Release -warnaserror
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Verify Index default install, real inference and owned package transitions
      id: index-lifecycle
      timeout-minutes: 11
      shell: pwsh
      run: |
        ./dev.ps1 package-e2e -Scenario index-windows
        exit $LASTEXITCODE
    - name: Preserve only structured Index verification
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: typelay-index-windows-${{ github.sha }}
        path: |
          artifacts/index-production/result.json
          artifacts/ci/
        if-no-files-found: warn
        retention-days: 14
    needs: fonts
  index-linux:
    name: Index / linux
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - *tested-source
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Install explicit setup dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-gi libglib2.0-bin
        python -m pip install uv==0.13.4
    - name: Prepare and verify official Index model and CPU closure
      timeout-minutes: 10
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python eng/ci/fixed.py restore index --wait-for-job fcitx-build
        python eng/linux/index/prepare_runtime.py --cache artifacts/index-runtime-download --output artifacts/index-runtime
        python eng/shared/prepare_index_model.py --output artifacts/index-model-download
    - name: Build the actual Linux host and worker payload
      id: index-package
      timeout-minutes: 10
      run: |
        dotnet publish src/linux/TypeLay.Linux -c Release -r linux-x64 --self-contained true -o artifacts/index-package/app -warnaserror
        python - <<'PY'
        import shutil, subprocess
        from pathlib import Path
        from eng.linux.build import package_worker
        from eng.linux.uv.prepare import prepare as prepare_uv
        package = Path('artifacts/index-package').absolute()
        package_worker(package, index_runtime=Path('artifacts/index-runtime').absolute())
        prepare_uv(Path('artifacts/linux/uv-download'), package / 'support/uv')
        shutil.copytree('src/linux/desktop', package / 'desktop', ignore=shutil.ignore_patterns('__pycache__', '*.pyc'))
        (package / 'native').mkdir()
        subprocess.run(['gcc', '-O2', '-Wall', '-Wextra', '-Werror', 'src/linux/native/supervise.c', '-o', str(package / 'native/typelay-supervise')], check=True)
        PY
    - name: Verify Index default preparation, actual host and package transitions
      id: index-lifecycle
      timeout-minutes: 11
      run: |
        /usr/bin/python3 tests/linux/index_package_e2e.py --package artifacts/index-package --cache artifacts/index-model-download --output artifacts/index-production
    - name: Preserve only structured Index verification
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: typelay-index-linux-${{ github.sha }}
        path: |
          artifacts/index-production/result.json
          artifacts/ci/
        if-no-files-found: warn
        retention-days: 14
  linux:
