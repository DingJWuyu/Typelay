            artifacts/linux/settings-ui/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Verify ordinary browser fields through the production DOM adapter
        id: browser-dom
        if: ${{ needs.scope.outputs.quality_only != 'true' && !cancelled() && steps.build.outcome == 'success' && steps.display.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          python tests/linux/browser_e2e.py --chromium /usr/bin/chromium -v
      - name: Verify browser native messaging and document routing
        id: browser-native
        if: ${{ needs.scope.outputs.quality_only != 'true' && !cancelled() && steps.build.outcome == 'success' && steps.display.outcome == 'success' }}
        run: |
