name: TypeLay checks
on:
  push:
    branches: [trunk, windows-preview, cachyos-preview, work/linux-usability, work/windows-experience, work/linux-settings]
  pull_request:
    branches: [trunk, windows-preview, cachyos-preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typelay-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.select.outputs.windows }}
      linux: ${{ steps.select.outputs.linux }}
      qt: ${{ steps.select.outputs.qt }}
      settings: ${{ steps.select.outputs.settings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks from the actual platform branch changes
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PYCODE'
          import os, re, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          windows, linux, qt, settings = True, True, False, False
          branch = os.environ['BRANCH']
          if os.environ['EVENT_NAME'] == 'push' and branch in ('work/linux-usability', 'work/windows-experience'):
              base = git('merge-base', 'origin/trunk', 'HEAD')
              # All branch commits count, including a changed file later reverted.
              paths = set(git('log', '-m', '--format=', '--name-only', f'{base}..HEAD').splitlines()) - {''}
              before = os.environ.get('BEFORE', '')
              valid_before = bool(re.fullmatch(r'[0-9a-f]{40}', before)) and before != '0' * 40
              valid_before = valid_before and subprocess.run(['git', 'merge-base', '--is-ancestor', before, 'HEAD'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
              pushed = set(git('log', '-m', '--format=', '--name-only', f'{before}..HEAD').splitlines()) if valid_before else {'.github/'}
              workflow_changed = any(x.startswith('.github/') for x in pushed)
              neutral = lambda x: x.startswith(('docs/', '.github/')) or x in ('README.md', 'AGENTS.md', 'GLOSSARY.md')
              platform_paths = {x for x in paths if not neutral(x)}
              linux_only = bool(platform_paths) and all(x.startswith(('src/linux/', 'tests/linux/', 'eng/linux/', 'packaging/linux/')) for x in platform_paths)
              windows_only = bool(platform_paths) and all(x.startswith(('src/windows/', 'tests/windows/', 'eng/windows/', 'packaging/windows/')) for x in platform_paths)
              # BEGIN one-time verified Windows integration
              if branch == 'work/windows-experience' and before == '6caea298fc6de48bccb0f1e019cd52efd0b2193e' and valid_before:
                  verified = '3bfa659cbf228a1242369b5c343a4bb101a45094'
                  try:
                      parents = git('rev-list', '--parents', '-n', '1', 'HEAD').split()[1:]
                      original = subprocess.check_output(['git', 'show', verified + ':.github/workflows/check.yml'])
                      current = subprocess.check_output(['git', 'show', 'HEAD:.github/workflows/check.yml'])
                      begin = b'              # BEGIN one-time verified Windows integration\n'
                      end = b'              # END one-time verified Windows integration\n'
                      def without_bridge(value):
                          if value.count(begin) != 1 or value.count(end) != 1 or value.index(begin) >= value.index(end):
                              raise ValueError('unexpected scope block')
                          return value[:value.index(begin)] + value[value.index(end) + len(end):]
                      restored = without_bridge(current).replace(b"                      baseline = '3bfa659cbf228a1242369b5c343a4bb101a45094'", b"                      baseline = '3f56aa345361da5b694c5084b992de831dac3daa'")
                      unchanged = subprocess.run(['git', 'diff', '--quiet', verified, 'HEAD', '--', '.', ':!src/windows/**', ':!tests/windows/**', ':!eng/windows/**', ':!packaging/windows/**', ':!docs/**', ':!.github/workflows/check.yml', ':!README.md', ':!AGENTS.md', ':!GLOSSARY.md']).returncode == 0
                      if parents == [verified] and restored == without_bridge(original) and unchanged:
                          windows_only, workflow_changed = True, False
                  except (subprocess.CalledProcessError, ValueError):
                      pass
              # END one-time verified Windows integration
              if not workflow_changed:
                  windows_push = all(neutral(x) or x.startswith(('src/windows/', 'tests/windows/', 'eng/windows/', 'packaging/windows/')) for x in pushed if x)
                  if branch == 'work/windows-experience' and not windows_only and windows_push:
                      # This exact combined candidate was exercised on both platforms.
                      # Reusing its unchanged Linux/shared bytes is not a claim that
                      # every GUI scenario passed. Any shared/unknown change runs both.
                      baseline = '3bfa659cbf228a1242369b5c343a4bb101a45094'
                      if subprocess.run(['git', 'cat-file', '-e', baseline + '^{commit}'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0:
                          windows_only = subprocess.run(['git', 'diff', '--quiet', baseline, 'HEAD', '--', '.', ':!src/windows/**', ':!tests/windows/**', ':!eng/windows/**', ':!packaging/windows/**', ':!docs/**', ':!.github/**', ':!README.md', ':!AGENTS.md', ':!GLOSSARY.md']).returncode == 0
                  if branch == 'work/linux-usability' and linux_only:
                      windows = False
                      allowed = re.compile(r'^(src/linux/native/qt6/|src/linux/native/fcitx5/typelay-fcitx-qt-v1\.h$|eng/linux/cooperative/(qt\.py|qt-runtime-probe\.cpp|patches/fcitx5-qt\.patch)$|tests/linux/qt_cooperative/|tests/linux/qt_desktop\.py$|tests/linux/fixtures/qt_native_fixture\.cpp$)')
                      if all(allowed.search(x) for x in platform_paths):
                          # A reused client is valid only if every executed production
                          # input outside this rebuilt Qt adapter is byte-identical.
                          unchanged = subprocess.run(['git', 'diff', '--quiet', 'd607db1b8a3fc882cfd4a9c19a6e454d9b610189', 'HEAD', '--', '.', ':!docs/**', ':!tests/**', ':!.github/**', ':!README.md', ':!AGENTS.md', ':!GLOSSARY.md', ':!src/linux/native/qt6/**', ':!src/linux/native/fcitx5/typelay-fcitx-qt-v1.h', ':!eng/linux/cooperative/qt.py', ':!eng/linux/cooperative/qt-runtime-probe.cpp', ':!eng/linux/cooperative/patches/fcitx5-qt.patch']).returncode == 0
                          qt = unchanged
                          linux = not qt
                  elif branch == 'work/windows-experience' and windows_only:
                      linux = False
          if os.environ['EVENT_NAME'] == 'push' and branch == 'work/linux-settings':
              # Temporary UI branch is partial acceptance; remove after integration.
              # Unknown production
              # changes fall back to the full jobs; no model/adaptor claim is inferred.
              verified = '79965d49ea1ed8494fa917cd2a3ffb669b3e093a'
              previous = os.environ.get('BEFORE', '')
              parents = git('rev-list', '--parents', '-n', '1', 'HEAD').split()[1:]
              # Only this reviewed first commit can introduce the partial-job wiring.
              wiring_unchanged = previous == '0' * 40 and parents == [verified]
              if re.fullmatch(r'[0-9a-f]{40}', previous) and previous != '0' * 40 and subprocess.run(['git', 'merge-base', '--is-ancestor', previous, 'HEAD'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0:
                  wiring_unchanged = not any(x.startswith('.github/') for x in git('log', '-m', '--format=', '--name-only', f'{previous}..HEAD').splitlines())
              unchanged = subprocess.run(['git', 'diff', '--quiet', verified, 'HEAD', '--', '.', ':!src/linux/desktop/ui.py', ':!tests/linux/desktop_e2e.py', ':!.github/workflows/check.yml', ':!docs/**']).returncode == 0
              if wiring_unchanged and unchanged:
                  windows, linux, qt, settings = False, True, False, True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              for name, value in [('windows', windows), ('linux', linux), ('qt', qt), ('settings', settings)]:
                  stream.write(f'{name}={str(value).lower()}\n')
          PYCODE
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive the exact build source
        run: |
          mkdir -p artifacts
          git archive --format=tar --prefix=typelay/ HEAD > artifacts/TypeLay-source.tar
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check repository Python formatting and lint
        run: |
          python -m pip install -r eng/requirements.txt
          python -m ruff check .
          python -m ruff format --check --diff .
      - name: Verify Linux input feedback contracts
        run: python tests/linux/input_feedback.py -v
      - name: Verify shared behavior without Windows
        shell: pwsh
        run: ./dev.ps1 shared-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: typelay-shared-${{ github.sha }}
          path: |
            artifacts/shared-test-results/
            artifacts/TypeLay-source.tar
          if-no-files-found: warn
          retention-days: 14
  check:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install developer tooling
        shell: pwsh
        run: |
          python -m pip install -r eng/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\Program Files\LLVM\bin' >> $env:GITHUB_PATH
      - name: Build the Windows workspace
        id: windows-build
        shell: pwsh
        run: ./dev.ps1 build
      - name: Verify Windows behavior and contracts
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        shell: pwsh
        env:
          TYPELAY_TRACE: ${{ github.workspace }}/artifacts/controller-trace.jsonl
        run: dotnet test TypeLay.slnx -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
      - name: Verify formatting and Python behavior
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/src/shared/TypeLay.Worker
        run: |
          dotnet format TypeLay.slnx --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/shared/worker -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check --diff .
          exit $LASTEXITCODE
      - name: Verify the controlled native adapter
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        shell: pwsh
        run: ./dev.ps1 native-e2e
      - name: Verify continuous translation with the real local model
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        timeout-minutes: 25
        shell: pwsh
        run: |
          dotnet tests/windows/fixtures/TypeLay.DesktopFixture/bin/Release/net10.0-windows/TypeLay.DesktopFixture.dll --verify-continuous artifacts/continuous-translation src/shared/TypeLay.Worker/run_worker.py tests/windows/fixtures/TypeLay.NativeFixture/bin/Release/net10.0/TypeLay.NativeFixture.dll
          exit $LASTEXITCODE
      # The metadata-only browser research probe is paused at an unresolved CI startup
      # precondition. Run its documented script explicitly when new evidence warrants it;
      # the ordinary Chrome product regression above remains required and keeps its result.
      - name: Package and test the relocated distribution
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        shell: pwsh
        run: ./dev.ps1 pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: typelay-windows-${{ github.sha }}
          path: |
            artifacts/test-results/
            artifacts/controller-trace.jsonl*
            artifacts/continuous-translation/result.json
            artifacts/continuous-translation/trace*.jsonl
            artifacts/continuous-translation/data/setup-self-check.json
            artifacts/TypeLay-Windows-preview.zip
            artifacts/TypeLay-Windows-preview.zip.sha256
          if-no-files-found: warn
          retention-days: 14
  linux:
    name: ${{ needs.scope.outputs.settings == 'true' && 'Linux settings iteration (partial acceptance)' || 'linux' }}
    needs: scope
    if: needs.scope.outputs.linux == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      # Electron's font service exceeds Docker's default 64 MiB /dev/shm.
      options: --shm-size=1g
    timeout-minutes: 30
    env:
      TYPELAY_EXPECT_QT_VERSION: 6.11.2
      CCACHE_DIR: ${{ github.workspace }}/artifacts/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 512MiB
    steps:
      - name: Install target desktop build dependencies
        run: pacman -Syu --noconfirm git cmake ninja pkgconf gtk3 gtk4 at-spi2-core json-glib python python-gobject libayatana-appindicator niri mesa uv grim noto-fonts-cjk curl icu openssl zlib libxkbcommon-x11 xdg-desktop-portal-gtk xorg-server-xvfb xdotool dbus chromium python-playwright firefox geckodriver code nodejs npm fcitx5 fcitx5-gtk fcitx5-chinese-addons boost libime patch fmt glib2-devel nlohmann-json expat xkeyboard-config iso-codes extra-cmake-modules gettext wayland-protocols plasma-wayland-protocols ccache opencc procps-ng zstd qt6-base libxkbcommon libxcb
      - name: Match the target GTK4 upstream release
        if: needs.scope.outputs.settings != 'true'
        run: |
          mkdir -p /tmp/typelay-target-sdk
          cd /tmp/typelay-target-sdk
          package='gtk4-1%3A4.22.5-1-x86_64.pkg.tar.zst'
          curl --fail --location "https://archive.archlinux.org/packages/g/gtk4/$package" -o gtk4.pkg.tar.zst
          curl --fail --location "https://archive.archlinux.org/packages/g/gtk4/$package.sig" -o gtk4.pkg.tar.zst.sig
          echo '7386543a425d523b76f08a8269b530dcbebc45a53a68cfdef5251e8238d60dc9  gtk4.pkg.tar.zst' | sha256sum -c -
          echo '894fd81f845eb49137d73056f62b27f2d194d2990ebe6dfdc956cd678db76048  gtk4.pkg.tar.zst.sig' | sha256sum -c -
          pacman -U --noconfirm ./gtk4.pkg.tar.zst
          test "$(pkg-config --modversion gtk4)" = 4.22.5
      - name: Match the target Qt upstream ABI
        if: needs.scope.outputs.settings != 'true'
        run: |
          mkdir -p /tmp/typelay-target-sdk
          cd /tmp/typelay-target-sdk
          package='qt6-base-6.11.2-3-x86_64.pkg.tar.zst'
          curl --fail --location "https://archive.archlinux.org/packages/q/qt6-base/$package" -o "$package"
          curl --fail --location "https://archive.archlinux.org/packages/q/qt6-base/$package.sig" -o "$package.sig"
          echo '257c5ef6180119d5b4365bdfe2a2ad051694b5dff390eac8e736dd78b8107b21  qt6-base-6.11.2-3-x86_64.pkg.tar.zst' | sha256sum -c -
          echo 'abf939ab10c2d7f28af81e5230c72e2acbd803fe43590fda331f474ec871dcfb  qt6-base-6.11.2-3-x86_64.pkg.tar.zst.sig' | sha256sum -c -
          pacman -U --noconfirm "./$package"
          test "$(pkg-config --modversion Qt6Core)" = 6.11.2
          test -f /usr/lib/qt6/plugins/platforms/libqwayland.so
      - name: Initialize the disposable container D-Bus identity
        run: dbus-uuidgen --ensure=/etc/machine-id
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Identify the native build environment
        if: needs.scope.outputs.settings != 'true'
        id: native-sdk
        run: echo "digest=$(pacman -Q | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: needs.scope.outputs.settings != 'true'
        id: fcitx-cache
        with:
          path: artifacts/ccache
          key: fcitx-ccache-${{ steps.native-sdk.outputs.digest }}-${{ hashFiles('eng/linux/cooperative/inputs.py', 'eng/linux/cooperative/fcitx.py', 'eng/linux/cooperative/patches/fcitx5.patch', 'eng/linux/cooperative/patches/fcitx5-chinese-addons.patch', 'eng/linux/cooperative/patches/fcitx5-gtk.patch') }}
          # ccache validates compiler content, flags and source/header hashes;
          # added unrelated SDK packages must not discard usable compile entries.
          restore-keys: |
            fcitx-ccache-${{ steps.native-sdk.outputs.digest }}-
            fcitx-ccache-
      - name: Build the relocatable Linux client
        id: build
        run: |
          # checkout runs as the host UID; this disposable container runs as root.
          # Trust only this Actions checkout, never every repository on the machine.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python tests/linux/test_build_bundle.py -v
          python tests/linux/setup_e2e.py -v
          python tests/linux/test_desktop_session.py -v
          python tests/linux/test_fcitx_session_source.py -v
          python eng/linux/build.py --with-test-fixture
      - name: Verify resumable model downloads over isolated HTTP
        if: ${{ needs.scope.outputs.settings != 'true' && !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python tests/linux/setup_e2e.py --http -v
          python tests/linux/setup_e2e.py --supervisor artifacts/linux/package/native/typelay-supervise -v
      - name: Verify nonblocking IPC and GTK unknown-IME refusal
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python tests/linux/wire.py -v
          python tests/linux/session_host_protocol.py --host artifacts/linux/package/app/TypeLay.Linux -v
          Xvfb :99 -screen 0 1280x960x24 -nolisten tcp &
          export DISPLAY=:99
          python tests/linux/native_e2e.py --gtk-refusal --native artifacts/linux/native --output artifacts/linux/nested
      - name: Verify tray controls without downloading models
        if: ${{ needs.scope.outputs.settings != 'true' && !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          GDK_BACKEND=x11 dbus-run-session -- python tests/linux/tray_e2e.py --package artifacts/linux/package
      - name: Verify ordinary browser fields through the production DOM adapter
        if: ${{ needs.scope.outputs.settings != 'true' && !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          python tests/linux/browser_e2e.py --chromium /usr/bin/chromium -v
      - name: Verify browser native messaging and document routing
        if: ${{ needs.scope.outputs.settings != 'true' && !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          python tests/linux/browser_native_e2e.py --package artifacts/linux/package --chromium /usr/bin/chromium -v
      - name: Probe source-owned VS Code edit transactions
        if: ${{ needs.scope.outputs.settings != 'true' && !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          set -- /usr/lib/electron*/electron
          test "$#" -eq 1
          python tests/linux/vscode_e2e.py --code "$1" --app /usr/lib/code
      - name: Probe real rich-editor transaction reentrancy
        if: ${{ needs.scope.outputs.settings != 'true' && !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p artifacts/editor-probe
          cp tests/linux/fixtures/editor/package*.json artifacts/editor-probe/
          npm ci --prefix artifacts/editor-probe --ignore-scripts --no-audit --no-fund
          export DISPLAY=:99
          python tests/linux/editor_probe.py --dependencies artifacts/editor-probe --chromium /usr/bin/chromium -v
      - name: Verify Firefox temporary extension and native messaging
        if: ${{ needs.scope.outputs.settings != 'true' && !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          python tests/linux/firefox_native_e2e.py --package artifacts/linux/package --firefox /usr/bin/firefox --geckodriver /usr/bin/geckodriver --editor-bundle artifacts/editor-probe/fixture.js -v
      - name: Probe real Fcitx client requests and candidate selection
        if: ${{ needs.scope.outputs.settings != 'true' && !cancelled() && steps.build.outcome == 'success' }}
        run: python tests/linux/fcitx_probe.py
      - name: Verify isolated Fcitx and GTK cooperative transactions
        id: fcitx
        if: ${{ needs.scope.outputs.settings != 'true' && !cancelled() && steps.build.outcome == 'success' }}
        run: python tests/linux/fcitx_cooperative/run.py --core-version 5.1.22
      - name: Probe original Fcitx Qt input delivery boundaries
        id: qt
        if: ${{ needs.scope.outputs.settings != 'true' && !cancelled() && steps.fcitx.outcome == 'success' }}
        run: python tests/linux/qt_cooperative/run.py --fcitx-root artifacts/linux/fcitx-cooperative-5.1.22
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ needs.scope.outputs.settings != 'true' && !cancelled() && (steps.fcitx.outcome == 'success' || steps.fcitx.outcome == 'failure') && steps.fcitx-cache.outputs.cache-hit != 'true' }}
        with:
          path: artifacts/ccache
          key: ${{ steps.fcitx-cache.outputs.cache-primary-key }}
      - name: Package and relocate the optional Fcitx cooperation runtime
        id: fcitx-package
        # pack.py requires matching successful-build inputs. A later isolated
        # fixture failure stays red but must not hide the independent real
        # default-session deployment result for those same built components.
        if: ${{ needs.scope.outputs.settings != 'true' && !cancelled() && (steps.fcitx.outcome == 'success' || steps.fcitx.outcome == 'failure') }}
        env:
          QT_PROBE_OUTCOME: ${{ steps.qt.outcome }}
        run: |
          set --
          if [ "$QT_PROBE_OUTCOME" = success ]; then
            set -- --qt-output artifacts/linux/qt-cooperative
          else
            echo "Qt probe did not pass; preserve its failure and collect independent GTK evidence."
          fi
          python packaging/linux/fcitx-cooperative/pack.py --build-output artifacts/linux/fcitx-cooperative-5.1.22 "$@" --output artifacts/TypeLay-Fcitx-cooperative.tar.gz
          mkdir -p "artifacts/linux/relocated 输入法"
          tar -xzf artifacts/TypeLay-Fcitx-cooperative.tar.gz -C "artifacts/linux/relocated 输入法"
          # Match the user's profile-writing versions in this disposable container.
          # Keep normal package signatures and dependency validation enabled.
          mkdir -p artifacts/linux/target-packages
          cd artifacts/linux/target-packages
          curl --fail --location --output libime.pkg.tar.zst https://archive.archlinux.org/packages/l/libime/libime-1.1.16-1-x86_64.pkg.tar.zst
          curl --fail --location --output libime.pkg.tar.zst.sig https://archive.archlinux.org/packages/l/libime/libime-1.1.16-1-x86_64.pkg.tar.zst.sig
          curl --fail --location --output chinese.pkg.tar.zst https://archive.archlinux.org/packages/f/fcitx5-chinese-addons/fcitx5-chinese-addons-5.1.14-1-x86_64.pkg.tar.zst
          curl --fail --location --output chinese.pkg.tar.zst.sig https://archive.archlinux.org/packages/f/fcitx5-chinese-addons/fcitx5-chinese-addons-5.1.14-1-x86_64.pkg.tar.zst.sig
          printf '%s\n' 'adacfc6243df2544665a1d4cc8f2bf2ee6d4966fc2c5f2a37a3ff579134b6c67  libime.pkg.tar.zst' 'cc03b9d1d0bb921d88130e4ef17a4162a1037f6dbb0a165f6a73b83236f06ec4  chinese.pkg.tar.zst' | sha256sum --check
          pacman -U --noconfirm libime.pkg.tar.zst chinese.pkg.tar.zst
          cd ../../..
          python "artifacts/linux/relocated 输入法/TypeLay-Fcitx-cooperative/fcitx-cooperative.py" preflight
      - name: Attach the matching desktop components to the main distribution
        id: complete-package
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.fcitx-package.outcome == 'success' && steps.qt.outcome == 'success' }}
        run: |
          python eng/linux/build.py --finalize --cooperation-package artifacts/TypeLay-Fcitx-cooperative.tar.gz
          TYPELAY_REQUIRE_DESKTOP_COMPONENT=1 TYPELAY_LINUX_PACKAGE="$PWD/artifacts/TypeLay-Linux-preview-x86_64.tar.gz" python tests/linux/distribution_e2e.py -v
      - name: Install and verify actual local translation components
        id: models
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p artifacts/linux/desktop-data artifacts/linux/desktop-cache
          python artifacts/linux/package/desktop/setup.py "$PWD/artifacts/linux/package" "$PWD/artifacts/linux/desktop-data/typelay" "$PWD/artifacts/linux/desktop-cache/typelay"
      - name: Verify first-run tutorial with the real local model
        if: ${{ !cancelled() && steps.models.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          export XDG_CONFIG_HOME="$PWD/artifacts/linux/setup-desktop-config"
          export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
          export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
          python tests/linux/native_e2e.py --desktop --desktop-scope setup --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/setup-desktop
      - name: Exercise the production desktop and real browser input
        if: ${{ needs.scope.outputs.settings != 'true' && !cancelled() && steps.models.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          export XDG_CONFIG_HOME="$PWD/artifacts/linux/desktop-config"
          export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
          export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
          python tests/linux/native_e2e.py --desktop --desktop-scope browser --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/desktop --editor-bundle artifacts/editor-probe/fixture.js
      - name: Exercise relocated Fcitx and cooperative GTK with the real local model
        if: ${{ needs.scope.outputs.settings != 'true' && !cancelled() && steps.models.outcome == 'success' && steps.fcitx-package.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          export XDG_CONFIG_HOME="$PWD/artifacts/linux/gtk-desktop-config"
          export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
          export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
          python tests/linux/native_e2e.py --desktop --desktop-scope gtk --gtk-session-bindings --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/gtk-desktop --fcitx-cooperative "artifacts/linux/relocated 输入法/TypeLay-Fcitx-cooperative"
      - name: Exercise cooperative GTK4 Entry with the real local model
        if: ${{ needs.scope.outputs.settings != 'true' && !cancelled() && steps.models.outcome == 'success' && steps.fcitx-package.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          export XDG_CONFIG_HOME="$PWD/artifacts/linux/gtk4-desktop-config"
          export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
          export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
          python tests/linux/native_e2e.py --desktop --desktop-scope gtk4 --gtk-session-bindings --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/gtk4-desktop --fcitx-cooperative "artifacts/linux/relocated 输入法/TypeLay-Fcitx-cooperative"
      - name: Exercise relocated Qt6 widgets with the real local model
        if: ${{ needs.scope.outputs.settings != 'true' && !cancelled() && steps.models.outcome == 'success' && steps.qt.outcome == 'success' && steps.fcitx-package.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          export XDG_CONFIG_HOME="$PWD/artifacts/linux/qt-desktop-config"
          export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
          export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
          python tests/linux/native_e2e.py --desktop --desktop-scope qt --package artifacts/linux/package --native artifacts/linux/native --output artifacts/linux/qt-desktop --fcitx-cooperative "artifacts/linux/relocated 输入法/TypeLay-Fcitx-cooperative" --qt-cooperative artifacts/linux/qt-cooperative
      - name: Verify installed VS Code command with the real local model
        if: ${{ needs.scope.outputs.settings != 'true' && !cancelled() && steps.models.outcome == 'success' }}
        run: |
          export DISPLAY=:99
          set -- /usr/lib/electron*/electron
          test "$#" -eq 1
          python tests/linux/vscode_e2e.py --code "$1" --app /usr/lib/code --vsix "$PWD/artifacts/linux/package/vscode/typelay-editor.vsix" --code-cli /usr/bin/code --host "$PWD/artifacts/linux/package/typelay" --model-data "$PWD/artifacts/linux/desktop-data/typelay" --output artifacts/linux/vscode-model
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: typelay-linux-${{ github.sha }}
          path: |
            artifacts/linux/nested/
            artifacts/linux/desktop/
            artifacts/linux/gtk-desktop/
            artifacts/linux/qt-desktop/
            artifacts/linux/gtk4-desktop/
            artifacts/linux/setup-desktop/
            artifacts/linux/firefox-native/
            artifacts/linux/browser-native/
            artifacts/linux/vscode/
            artifacts/linux/vscode-model/
            artifacts/linux/editor-probe/
            artifacts/linux/fcitx-probe/
            artifacts/linux/qt-cooperative/*.json
            artifacts/linux/qt-cooperative/*.log
            artifacts/linux/fcitx-cooperative-5.1.22/*.json
            artifacts/linux/fcitx-cooperative-5.1.22/*.log
            ${{ steps.complete-package.outcome != 'success' && 'artifacts/TypeLay-Fcitx-cooperative.tar.gz' || '' }}
            artifacts/linux/desktop-data/typelay/components/*/self-check.json
            artifacts/linux/native/libtypelay-gtk3.so
            artifacts/linux/native/typelay-supervise
            artifacts/TypeLay-Linux-preview-x86_64.tar.gz
            artifacts/TypeLay-Linux-preview-x86_64.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 14
# Passing this job does not certify physical Tab, Chinese IME, visual parity or safe universal writeback.

  qt-iteration:
    name: Linux Qt iteration (not full product acceptance)
    needs: scope
    if: needs.scope.outputs.qt == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --shm-size=1g
    timeout-minutes: 15
    env:
      TYPELAY_EXPECT_QT_VERSION: 6.11.2
    permissions:
      contents: read
      actions: read
    steps:
      - name: Install isolated Qt iteration dependencies
        run: pacman -Syu --noconfirm git cmake ninja pkgconf python curl unzip patch extra-cmake-modules libxkbcommon libxcb fcitx5 boost-libs opencc xorg-server-xvfb xdotool dbus gtk3 python-gobject libayatana-appindicator niri mesa grim noto-fonts-cjk uv icu openssl zlib
      - name: Match the target Qt upstream ABI
        run: |
          mkdir -p /tmp/typelay-target-sdk
          cd /tmp/typelay-target-sdk
          package='qt6-base-6.11.2-3-x86_64.pkg.tar.zst'
          curl --fail --location "https://archive.archlinux.org/packages/q/qt6-base/$package" -o "$package"
          curl --fail --location "https://archive.archlinux.org/packages/q/qt6-base/$package.sig" -o "$package.sig"
          echo '257c5ef6180119d5b4365bdfe2a2ad051694b5dff390eac8e736dd78b8107b21  qt6-base-6.11.2-3-x86_64.pkg.tar.zst' | sha256sum -c -
          echo 'abf939ab10c2d7f28af81e5230c72e2acbd803fe43590fda331f474ec871dcfb  qt6-base-6.11.2-3-x86_64.pkg.tar.zst.sig' | sha256sum -c -
          pacman -U --noconfirm "./$package"
          test "$(pkg-config --modversion Qt6Core)" = 6.11.2
          test -f /usr/lib/qt6/plugins/platforms/libqwayland.so
      - name: Initialize the disposable container D-Bus identity
        run: dbus-uuidgen --ensure=/etc/machine-id
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reuse the exact verified cooperation runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/qt-runtime artifacts/qt-probe-root
          curl --fail --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/DingJWuyu/Typelay/actions/artifacts/11797631952/zip \
            -o artifacts/qt-runtime/evidence.zip
          echo '3bf7bf2ebc650efd80f16073a1792633cabdfce45478888d0dadab39a815fa35  artifacts/qt-runtime/evidence.zip' | sha256sum -c -
          unzip -p artifacts/qt-runtime/evidence.zip TypeLay-Fcitx-cooperative.tar.gz > artifacts/qt-runtime/runtime.tar.gz
          echo 'afe4f71d8e7476eec1f48ed1c041a5f6f6a4191de66299b58f63a8e9fc5083ac  artifacts/qt-runtime/runtime.tar.gz' | sha256sum -c -
          tar -xzf artifacts/qt-runtime/runtime.tar.gz -C artifacts/qt-runtime
          unzip -p artifacts/qt-runtime/evidence.zip TypeLay-Linux-preview-x86_64.tar.gz > artifacts/qt-runtime/client.tar.gz
          echo '23562c9f82ab9be9a4966978d61c600b3c74d4f07f91e80af0f0400ef6fe190a  artifacts/qt-runtime/client.tar.gz' | sha256sum -c -
          tar -xzf artifacts/qt-runtime/client.tar.gz -C artifacts/qt-runtime
          prefix="$PWD/artifacts/qt-runtime/TypeLay-Fcitx-cooperative/core"
          ln -s "$prefix/bin/fcitx5" artifacts/qt-probe-root/fcitx5
          ln -s "$prefix" artifacts/qt-probe-root/core-prefix
          ln -s "$prefix/lib/fcitx5" artifacts/qt-probe-root/lib
          printf '%s\n' 'sourceCommit=d607db1b8a3fc882cfd4a9c19a6e454d9b610189' 'artifactId=11797631952' > artifacts/qt-runtime/provenance.txt
      - name: Probe the original Qt input path
        run: python tests/linux/qt_cooperative/run.py --fcitx-root artifacts/qt-probe-root
      - name: Install the same real local model for the isolated adapter scenario
        run: |
          mkdir -p artifacts/linux/desktop-data artifacts/linux/desktop-cache
          python artifacts/qt-runtime/TypeLay-Linux-preview/desktop/setup.py "$PWD/artifacts/qt-runtime/TypeLay-Linux-preview" "$PWD/artifacts/linux/desktop-data/typelay" "$PWD/artifacts/linux/desktop-cache/typelay"
      - name: Exercise the current adapter with the fixed production client
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 > artifacts/qt-runtime/xvfb.log 2>&1 &
          xvfb=$!
          trap 'kill "$xvfb" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            if xdotool getdisplaygeometry >/dev/null 2>&1; then break; fi
            kill -0 "$xvfb"
            sleep 0.05
          done
          xdotool getdisplaygeometry
          export XDG_CONFIG_HOME="$PWD/artifacts/linux/qt-desktop-config"
          export XDG_DATA_HOME="$PWD/artifacts/linux/desktop-data"
          export XDG_CACHE_HOME="$PWD/artifacts/linux/desktop-cache"
          python tests/linux/native_e2e.py --desktop --desktop-scope qt --package artifacts/qt-runtime/TypeLay-Linux-preview --native artifacts/linux/native --output artifacts/linux/qt-desktop --fcitx-cooperative artifacts/qt-probe-root --qt-cooperative artifacts/linux/qt-cooperative
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: typelay-qt-iteration-${{ github.sha }}
          path: |
            artifacts/linux/qt-cooperative/*.json
            artifacts/linux/qt-cooperative/*.log
            artifacts/qt-runtime/provenance.txt
            artifacts/qt-runtime/xvfb.log
            artifacts/linux/qt-desktop/
          if-no-files-found: warn
          retention-days: 14
