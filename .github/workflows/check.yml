name: TypeLay checks
on:
  push:
    branches: [trunk, windows-preview, cachyos-preview, work/linux-usability, work/windows-experience]
  pull_request:
    branches: [trunk, windows-preview, cachyos-preview]
  workflow_dispatch:
    inputs:
      check_mode:
        description: Full checks or quality capture only (not product acceptance)
        type: choice
        required: false
        default: full
        options:
          - full
          - quality-only
      collect_translation_quality:
        description: Collect eight paired Linux responses once (diagnostic flags select their fixed sets)
        type: boolean
        required: false
        default: false
      hy_decode_comparison:
        description: "Compare only Hy ordinary greedy/sampled: 16 requests, 600 seconds, existing cache only"
        type: boolean
        required: false
        default: false
      fixed_model_diagnostics:
        description: Collect only fixed Argos boundary 32 and Hy ordinary 8 diagnostics (no quality verdict)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: typelay-checks-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.check_mode == 'quality-only' && 'quality-only' || 'full' }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.select.outputs.windows }}
      linux: ${{ steps.select.outputs.linux }}
      qt: ${{ steps.select.outputs.qt }}
      quality_only: ${{ steps.select.outputs.quality_only }}
      collect_quality: ${{ steps.select.outputs.collect_quality }}
      hy_decode_comparison: ${{ steps.select.outputs.hy_decode_comparison }}
      fixed_model_diagnostics: ${{ steps.select.outputs.fixed_model_diagnostics }}
      practice: ${{ steps.select.outputs.practice }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks from the actual platform branch changes
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HY_DECODE_COMPARISON: ${{ inputs.hy_decode_comparison }}
          FIXED_MODEL_DIAGNOSTICS: ${{ inputs.fixed_model_diagnostics }}
          CHECK_MODE: ${{ inputs.check_mode || 'full' }}
          COLLECT_TRANSLATION_QUALITY: ${{ inputs.collect_translation_quality }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
        run: |
          python eng/shared/ci_scope.py
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive the exact build source
        run: |
          mkdir -p artifacts
          git archive --format=tar --prefix=typelay/ HEAD > artifacts/TypeLay-source.tar
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check repository Python formatting and lint
        run: |
          python -m pip install -r eng/requirements.txt
          python -m ruff check .
          python -m ruff format --check --diff .
      - name: Verify Linux input feedback contracts
        run: python tests/linux/input_feedback.py -v
      - name: Verify shared behavior without Windows
        shell: pwsh
        run: ./dev.ps1 shared-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: typelay-shared-${{ github.sha }}
          path: |
            artifacts/shared-test-results/
            artifacts/TypeLay-source.tar
          if-no-files-found: warn
          retention-days: 14
  check:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Record the Windows check budget start
        shell: pwsh
        run: '"TYPELAY_WINDOWS_CHECK_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Observe standard Chrome profile before Windows tests
        shell: pwsh
        run: python eng/windows/observe-browser-profile.py --stage before-tests --output artifacts/browser-profile/before-tests.json
      - name: Install developer tooling
        shell: pwsh
        run: |
          python -m pip install -r eng/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\Program Files\LLVM\bin' >> $env:GITHUB_PATH
      - name: Build the Windows workspace
        id: windows-build
        shell: pwsh
        run: ./dev.ps1 build
      # Bounded mechanism experiment, not a product release gate. Reassess after this result.
      - name: Observe synchronous acceptance inside the owned source thread
        id: windows-source-synchronous
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $directory = 'artifacts/source-synchronous-acceptance'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          @{ kind = 'mechanism-experiment'; status = 'running'; expectedRows = 6; sourceSha = $env:GITHUB_SHA } | ConvertTo-Json | Set-Content "$directory/runner.json"
          & ./tests/windows/TypeLay.App.Tests/bin/Release/net10.0-windows/TypeLay.App.Tests.exe -explicit only -method 'TypeLay.App.Tests.SourceKeyboardBoundaryProbe.ObserveSelfOwnedSynchronousAcceptance' 2>&1 | Tee-Object -FilePath "$directory/runner.log"
          $code = $LASTEXITCODE
          $rows = @(Get-ChildItem -LiteralPath $directory -Filter result.json -File -Recurse | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json })
          $modes = @($rows | ForEach-Object { [int]$_.mode } | Sort-Object)
          $complete = ($modes -join ',') -eq '5,6,7,8,9,10'
          $failed = @($rows | Where-Object { $_.status -ne 'mechanism_observed_not_product_acceptance' -or -not $_.hooksClosed -or -not $_.processesExited -or -not $_.inputsPaired })
          $status = if (-not $complete) { 'incomplete' } elseif ($code -eq 0 -and $failed.Count -eq 0) { 'mechanism-observed' } else { 'experiment-failed' }
          @{ kind = 'mechanism-experiment'; status = $status; exitCode = $code; expectedRows = 6; observedModes = $modes; productAcceptance = $false; sourceSha = $env:GITHUB_SHA } | ConvertTo-Json | Set-Content "$directory/runner.json"
          if (-not $complete -or $failed.Count -ne 0) { exit 1 }
          exit $code
      # Research admission only: neither a product gate nor evidence of key/write support.
      - name: Observe existing TSF context in an owned standard Edit
        id: windows-tsf-context-admission
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $directory = 'artifacts/tsf-context-admission'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $runner = [ordered]@{ kind = 'research-admission'; status = 'running'; sourceSha = $env:GITHUB_SHA; exitCode = $null; productAcceptance = $false; resultCount = 0; resultMissing = $null; resultStatus = $null; processExited = $null; normalShutdown = $null; observationCount = 0; denial = $null; error = $null }
          $runner | ConvertTo-Json | Set-Content "$directory/runner.json"
          New-Item -ItemType File -Path "$directory/runner.log" -Force | Out-Null
          try {
            & ./tests/windows/TypeLay.App.Tests/bin/Release/net10.0-windows/TypeLay.App.Tests.exe -explicit only -method 'TypeLay.App.Tests.TsfContextAdmissionProbe.ObserveExistingContextOfSelfOwnedStockEdit' 2>&1 | Tee-Object -FilePath "$directory/runner.log"
            $runner.exitCode = $LASTEXITCODE
            $files = @(Get-ChildItem -LiteralPath $directory -Filter result.json -File -Recurse)
            $runner.resultCount = $files.Count
            $runner.resultMissing = $files.Count -eq 0
            if ($files.Count -eq 0) {
              $runner.status = 'missing-result'
            } elseif ($files.Count -ne 1) {
              $runner.status = 'nonunique-result'
            } else {
              $runner.status = 'invalid-result'
              $row = Get-Content -LiteralPath $files[0].FullName -Raw | ConvertFrom-Json
              $runner.resultStatus = $row.status
              $runner.processExited = $row.processExited
              $runner.normalShutdown = $row.normalShutdown
              $observations = @($row.observations)
              $runner.observationCount = $observations.Count
              $runner.denial = if ($observations.Count -gt 0) { $observations[-1].Denial } else { $null }
              $unreleased = @($observations | Where-Object { $_.OwnedReferencesReleased -isnot [bool] -or -not $_.OwnedReferencesReleased })
              $positive = @($observations | Select-Object -Skip 1 | Where-Object { $_.Stage -eq 'exact_existing_context_observed' -and $null -eq $_.Denial -and $_.SameContextOnRecheck -eq $true -and $_.ViewWindow -eq $_.ExpectedField -and $_.FocusVersionBefore -eq $_.FocusVersionAfter })
              $negativeControl = $observations.Count -ge 2 -and $observations[0].Denial -eq 'native_focus_mismatch' -and $observations[0].ManagerPresent -eq $false
              if ($row.processExited -isnot [bool] -or -not $row.processExited -or $row.normalShutdown -isnot [bool] -or -not $row.normalShutdown -or $unreleased.Count -ne 0) {
                $runner.status = 'cleanup-unconfirmed'
              } elseif ($row.productionReadiness -ne $false -or $row.diagnosticOnly -ne $true -or -not $negativeControl -or $observations.Count -gt 4) {
                $runner.status = 'invalid-observations'
              } elseif ($runner.exitCode -eq 0 -and $row.status -eq 'existing_context_observed_not_keyboard_or_write_support' -and $observations.Count -eq 4 -and $positive.Count -eq 3) {
                $runner.status = 'existing-context-observed-not-keyboard-or-write-support'
              } elseif ($runner.exitCode -ne 0 -and $row.status -eq 'existing_context_not_admitted' -and -not [string]::IsNullOrEmpty($runner.denial) -and $runner.denial -ne 'observation_exception' -and $positive.Count -eq ($observations.Count - 2)) {
                $runner.status = 'prerequisite-not-met'
              } else {
                $runner.status = 'probe-failed'
              }
            }
          } catch {
            $runner.error = $_.Exception.GetType().Name
            if ($runner.status -eq 'running') { $runner.status = 'runner-failed' }
          } finally {
            $runner | ConvertTo-Json -Depth 5 | Set-Content "$directory/runner.json"
          }
          "TSF research admission: $($runner.status); exitCode=$($runner.exitCode). This is not product acceptance or a model verdict." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($runner.status -ne 'existing-context-observed-not-keyboard-or-write-support') { exit 1 }
          exit 0
      - name: Preserve early Windows source research evidence
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' && hashFiles('artifacts/source-synchronous-acceptance/runner.*', 'artifacts/tsf-context-admission/runner.*') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typelay-windows-source-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/source-synchronous-acceptance/runner.json
            artifacts/source-synchronous-acceptance/runner.log
            artifacts/source-synchronous-acceptance/**/result.json
            artifacts/tsf-context-admission/runner.json
            artifacts/tsf-context-admission/runner.log
            artifacts/tsf-context-admission/**/result.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify Windows behavior and contracts
        id: windows-contracts
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        shell: pwsh
        env:
          TYPELAY_TRACE: ${{ github.workspace }}/artifacts/controller-trace.jsonl
        run: dotnet test TypeLay.slnx -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
      - name: Preserve early Windows contract failure evidence
        if: ${{ !cancelled() && steps.windows-contracts.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typelay-windows-contracts-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/*.trx
          if-no-files-found: error
          retention-days: 14
      - name: Observe claimed-key low-level callback timeout in owned sources
        id: windows-source-timeout
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        timeout-minutes: 3
        shell: pwsh
        run: |
          & ./tests/windows/TypeLay.App.Tests/bin/Release/net10.0-windows/TypeLay.App.Tests.exe -explicit only -method 'TypeLay.App.Tests.NativeSourceTimeoutProbe.RecordClaimThenLowLevelCallbackTimeout'
          exit $LASTEXITCODE
      - name: Observe source-thread keyboard boundaries in owned sources
        id: windows-source-keyboard
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        timeout-minutes: 4
        shell: pwsh
        run: |
          & ./tests/windows/TypeLay.App.Tests/bin/Release/net10.0-windows/TypeLay.App.Tests.exe -explicit only -method 'TypeLay.App.Tests.SourceKeyboardBoundaryProbe.ObserveSelfOwnedSourceKeyboardBoundary'
          exit $LASTEXITCODE
      - name: Observe consumption return and admission deadline in owned sources
        id: windows-source-consumption
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          & ./tests/windows/TypeLay.App.Tests/bin/Release/net10.0-windows/TypeLay.App.Tests.exe -explicit only -method 'TypeLay.App.Tests.SourceKeyboardBoundaryProbe.ObserveSelfOwnedConsumptionOrder'
          exit $LASTEXITCODE
      - name: Observe standard Chrome profile after behavior tests
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        shell: pwsh
        run: python eng/windows/observe-browser-profile.py --stage after-behavior-tests --output artifacts/browser-profile/after-behavior-tests.json
      - name: Verify formatting and Python behavior
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/src/shared/TypeLay.Worker
        run: |
          dotnet format TypeLay.slnx --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/shared/worker -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/windows/test_browser_profile_observation.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check --diff .
          exit $LASTEXITCODE
      - name: Verify the controlled native adapter
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        shell: pwsh
        run: ./dev.ps1 native-e2e
      - name: Verify continuous translation with the real local model
        id: windows-continuous
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        timeout-minutes: 25
        shell: pwsh
        run: |
          dotnet tests/windows/fixtures/TypeLay.DesktopFixture/bin/Release/net10.0-windows/TypeLay.DesktopFixture.dll --verify-continuous artifacts/continuous-translation src/shared/TypeLay.Worker/run_worker.py tests/windows/fixtures/TypeLay.NativeFixture/bin/Release/net10.0/TypeLay.NativeFixture.dll
          exit $LASTEXITCODE
      - name: Preserve early Windows continuous translation failure evidence
        if: ${{ !cancelled() && steps.windows-continuous.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typelay-windows-continuous-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/continuous-translation/result.json
            artifacts/continuous-translation/consumer-exit.json
          if-no-files-found: error
          retention-days: 14
      - name: Observe standard Chrome profile after continuous translation
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        shell: pwsh
        run: python eng/windows/observe-browser-profile.py --stage after-continuous --output artifacts/browser-profile/after-continuous.json
      - name: Restore the pinned cooperative-browser test archive
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        id: cooperative-browser-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/browser-download/chrome-win64.zip
          key: typelay-cft-win64-${{ hashFiles('tests/windows/support/chrome-for-testing.json') }}
      - name: Verify and prepare Chrome for Testing for the cooperative product path
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        id: cooperative-browser-prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content tests/windows/support/chrome-for-testing.json -Raw | ConvertFrom-Json
          $archive = Join-Path $PWD 'artifacts/browser-download/chrome-win64.zip'
          New-Item -ItemType Directory -Path (Split-Path $archive) -Force | Out-Null
          if (-not (Test-Path -LiteralPath $archive)) {
            Invoke-WebRequest -Uri $pin.archiveUrl -OutFile $archive -TimeoutSec 180
          }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.archiveSha256) {
            throw 'Chrome for Testing archive SHA-256 mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath artifacts/cooperative-browser
          $chrome = Join-Path $PWD 'artifacts/cooperative-browser/chrome-win64/chrome.exe'
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($chrome)
          if ($version.ProductVersion -ne $pin.version -or $version.ProductName -ne 'Google Chrome for Testing') {
            throw 'Chrome for Testing product/version mismatch.'
          }
          "chrome=$chrome" >> $env:GITHUB_OUTPUT
      - name: Cache the verified cooperative-browser archive
        if: ${{ !cancelled() && steps.cooperative-browser-prepare.outcome == 'success' && steps.cooperative-browser-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/browser-download/chrome-win64.zip
          key: ${{ steps.cooperative-browser-cache.outputs.cache-primary-key }}
      # The metadata-only browser research probe is paused at an unresolved CI startup
      # precondition. Run its documented script explicitly when new evidence warrants it;
      # the ordinary Chrome product regression above remains required and keeps its result.
      # Prepare fixed assets before the sole production package; inference stays serialized.
      - name: Admit the bounded production Hy package chain
        id: hy-admission
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:TYPELAY_WINDOWS_CHECK_START
          python eng/windows/admit-package-chain.py --elapsed-seconds $elapsed --report artifacts/hy-results/admission.json
          if ($LASTEXITCODE -ne 0) { throw 'Insufficient 75-minute job budget for the bounded ordinary-app and Hy chain.' }
          $pin = Get-Content src/shared/TypeLay.Worker/native/hy/assets.lock.json -Raw | ConvertFrom-Json
          "cache-key=typelay-hy-win-$($pin.model.sha256)-$($pin.runtime_archive.sha256)" >> $env:GITHUB_OUTPUT
      - name: Restore the fixed Hy model and CPU archive cache
        id: hy-cache
        if: ${{ !cancelled() && steps.hy-admission.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/hy-download/
          key: ${{ steps.hy-admission.outputs.cache-key }}
      - name: Prepare fixed Hy assets without an audit adapter
        id: hy-prepare
        if: ${{ !cancelled() && steps.hy-admission.outcome == 'success' && steps.hy-cache.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        run: ./dev.ps1 hy-product-prepare
      - name: Save only verified Hy download assets to cache
        if: ${{ !cancelled() && steps.hy-prepare.outcome == 'success' && steps.hy-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 2
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/hy-download/
          key: ${{ steps.hy-cache.outputs.cache-primary-key }}
      - name: Package and test the relocated distribution
        id: windows-package
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' && steps.hy-prepare.outcome == 'success' }}
        shell: pwsh
        env:
          TYPELAY_BROWSER_REGISTRATION_E2E: "1"
          TYPELAY_HY_WINDOWS_CPU_RUNTIME: artifacts/hy-runtime
        run: ./dev.ps1 pack -HyRuntime artifacts/hy-runtime
      - name: Verify cooperative browser input with the shipped app and real model
        id: windows-browser
        if: ${{ !cancelled() && steps.windows-package.outcome == 'success' && steps.cooperative-browser-prepare.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        env:
          TYPELAY_BROWSER_REGISTRATION_E2E: "1"
          # Only this fresh GitHub-hosted VM may use a verified empty standard container.
          TYPELAY_HOSTED_EMPTY_BROWSER_CONTAINER_E2E: ${{ runner.environment == 'github-hosted' && '1' || '0' }}
        run: |
          python eng/windows/observe-browser-profile.py --stage before-browser-cooperation --output artifacts/browser-profile/before-browser-cooperation.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tests/windows/fixtures/TypeLay.DesktopFixture/bin/Release/net10.0-windows/TypeLay.DesktopFixture.dll --verify-browser-cooperation artifacts/browser-cooperation artifacts/package/TypeLay '${{ steps.cooperative-browser-prepare.outputs.chrome }}'
          exit $LASTEXITCODE
      - name: Verify real classic Notepad through shipped app Settings
        id: windows-ordinary-notepad
        if: ${{ !cancelled() && steps.windows-package.outcome == 'success' && steps.windows-browser.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = 'tests/windows/fixtures/TypeLay.DesktopFixture/bin/Release/net10.0-windows'
          foreach ($assembly in @('TypeLay.App', 'TypeLay.Runtime', 'TypeLay.Core', 'TypeLay.Protocol', 'TypeLay.Windows.Contracts')) {
            Copy-Item -LiteralPath "artifacts/package/TypeLay/app/$assembly.dll" -Destination "$fixture/$assembly.dll" -Force
          }
          dotnet "$fixture/TypeLay.DesktopFixture.dll" --verify-ordinary-notepad artifacts/ordinary-notepad artifacts/package/TypeLay artifacts/continuous-translation
          exit $LASTEXITCODE
      # Scene failure stays red; only independently verified owner exit admits Hy.
      - name: Verify all prior model consumers have exited
        id: hy-consumer-exit
        if: ${{ !cancelled() && steps.windows-package.outcome == 'success' }}
        shell: pwsh
        env:
          CONTINUOUS_NONCE: ${{ steps.windows-continuous.outputs.consumer_exit_nonce }}
          BROWSER_NONCE: ${{ steps.windows-browser.outputs.consumer_exit_nonce }}
          NOTEPAD_NONCE: ${{ steps.windows-ordinary-notepad.outputs.consumer_exit_nonce }}
          WORKFLOW_CANCELLED: ${{ job.status != 'success' && job.status != 'failure' }}
        run: |
          python eng/windows/verify-consumer-exit.py --continuous-proof artifacts/continuous-translation/consumer-exit.json --browser-proof artifacts/browser-cooperation/consumer-exit.json --notepad-proof artifacts/ordinary-notepad/consumer-exit.json --continuous-nonce "$env:CONTINUOUS_NONCE" --browser-nonce "$env:BROWSER_NONCE" --notepad-nonce "$env:NOTEPAD_NONCE" --run-id "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT" --head "$env:GITHUB_SHA" --workflow-cancelled "$env:WORKFLOW_CANCELLED"
          exit $LASTEXITCODE
