          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv venv artifacts/font-tools
          uv pip install --python artifacts/font-tools/bin/python -r eng/requirements.txt
          artifacts/font-tools/bin/python eng/fonts/prepare.py
      - name: Verify Linux test_ui_fonts
        id: test-ui-fonts
        if: ${{ !cancelled() && steps.fonts.outcome == 'success' }}
        run: TYPELAY_UI_FONT_ROOT="$PWD/artifacts/ui-fonts" python tests/linux/test_ui_fonts.py -v
      - name: Verify Linux test_build_bundle
        id: test-build-bundle
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python tests/linux/test_build_bundle.py -v
      - name: Verify Linux setup_e2e
        id: setup-e2e
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python tests/linux/setup_e2e.py -v
      - name: Verify Linux private uv preparation
        id: private-uv
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python tests/linux/test_private_uv.py -v
      - name: Verify Linux test_desktop_session
        id: test-desktop-session
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python tests/linux/test_desktop_session.py -v
      - name: Verify Linux test_startup_diagnostics
        id: test-startup-diagnostics
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python tests/linux/test_startup_diagnostics.py -v
      - name: Verify Linux test_desktop_scope_results
        id: test-desktop-scope-results
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python tests/linux/test_desktop_scope_results.py -v
      - name: Verify Linux test_desktop_acceptance_observation
        id: test-desktop-acceptance-observation
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python tests/linux/test_desktop_acceptance_observation.py -v
      - name: Verify Linux test_session_key_settings
        id: test-session-key-settings
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python tests/linux/test_session_key_settings.py -v
      - name: Verify Linux test_setup_scope_data
        id: test-setup-scope-data
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python tests/linux/test_setup_scope_data.py -v
      - name: Verify Linux test_practice_session
