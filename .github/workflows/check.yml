# Passing this job does not certify physical Tab, Chinese IME, visual parity or safe universal writeback.

  index-windows:
    name: ${{ github.event_name == 'pull_request' && 'PR' || github.event_name == 'push' && github.ref == 'refs/heads/hitl' && 'hitl push' || github.event_name == 'push' && 'branch push' || 'manual' }} / Windows Index package lifecycle (not desktop acceptance)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.selected == 'success' && needs.scope.outputs.windows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Record independent job budget
        shell: pwsh
        run: '"TYPELAY_INDEX_CHECK_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          python -m pip install -r eng/requirements.txt
          exit $LASTEXITCODE
      - name: Restore only the pinned CPU runtime archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Model weights are ephemeral downloads, never persisted to a GitHub cache.
          path: artifacts/index-runtime-download/
          key: index-win-${{ hashFiles('eng/windows/index/runtime-archive.lock.json', 'src/shared/TypeLay.Worker/native/index/model.lock.json') }}
      - name: Prepare and verify official Index model and CPU closure
        timeout-minutes: 10
        shell: pwsh
        run: |
          python eng/windows/index/prepare_runtime.py --cache artifacts/index-runtime-download --output artifacts/index-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python eng/shared/prepare_index_model.py --output artifacts/index-model-download
          exit $LASTEXITCODE
      - name: Build the actual distribution and production fixture
        id: index-package
        timeout-minutes: 10
        shell: pwsh
        run: |
          ./dev.ps1 pack -IndexRuntime artifacts/index-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/windows/fixtures/TypeLay.DesktopFixture -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Index default install, real inference and owned package transitions
        id: index-lifecycle
        timeout-minutes: 11
        shell: pwsh
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:TYPELAY_INDEX_CHECK_START
          if ($elapsed -gt 1140) {
            New-Item -ItemType Directory -Force artifacts/index-production | Out-Null
            '{"suite":"index-windows-production-package-lifecycle","lifecycle":"not-run","reason":"insufficient-job-budget"}' | Set-Content artifacts/index-production/result.json
            exit 1
          }
          ./dev.ps1 package-e2e -Scenario index-windows
          exit $LASTEXITCODE
      - name: Report required checks, including not-run prerequisites
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_REQUIRED_STEPS: >-
            index-package
            index-lifecycle
        run: python eng/shared/ci_report.py
      - name: Preserve only structured Index verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typelay-index-windows-${{ github.sha }}
          path: |
            artifacts/index-production/result.json
            artifacts/ci/
          if-no-files-found: warn
          retention-days: 14
  index-linux:
    name: ${{ github.event_name == 'pull_request' && 'PR' || github.event_name == 'push' && github.ref == 'refs/heads/hitl' && 'hitl push' || github.event_name == 'push' && 'branch push' || 'manual' }} / Linux Index package lifecycle (not desktop acceptance)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.selected == 'success' && needs.scope.outputs.linux == 'true' && needs.scope.outputs.quality_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record independent job budget
        run: echo "TYPELAY_INDEX_CHECK_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install explicit setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi libglib2.0-bin
          python -m pip install uv==0.13.4
      - name: Restore only the pinned CPU runtime archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Model weights are ephemeral downloads, never persisted to a GitHub cache.
          path: artifacts/index-runtime-download/
          key: index-linux-${{ hashFiles('eng/linux/index/runtime-archive.lock.json', 'src/shared/TypeLay.Worker/native/index/model.lock.json') }}
      - name: Prepare and verify official Index model and CPU closure
        timeout-minutes: 10
        run: |
          python eng/linux/index/prepare_runtime.py --cache artifacts/index-runtime-download --output artifacts/index-runtime
          python eng/shared/prepare_index_model.py --output artifacts/index-model-download
      - name: Build the actual Linux host and worker payload
        id: index-package
        timeout-minutes: 10
        run: |
          dotnet publish src/linux/TypeLay.Linux -c Release -r linux-x64 --self-contained true -o artifacts/index-package/app -warnaserror
          python - <<'PY'
          import shutil, subprocess
          from pathlib import Path
          from eng.linux.build import package_worker
          from eng.linux.uv.prepare import prepare as prepare_uv
          package = Path('artifacts/index-package').absolute()
          package_worker(package, index_runtime=Path('artifacts/index-runtime').absolute())
          prepare_uv(Path('artifacts/linux/uv-download'), package / 'support/uv')
          shutil.copytree('src/linux/desktop', package / 'desktop', ignore=shutil.ignore_patterns('__pycache__', '*.pyc'))
          (package / 'native').mkdir()
          subprocess.run(['gcc', '-O2', '-Wall', '-Wextra', '-Werror', 'src/linux/native/supervise.c', '-o', str(package / 'native/typelay-supervise')], check=True)
          PY
      - name: Verify Index default preparation, actual host and package transitions
        id: index-lifecycle
        timeout-minutes: 11
        run: |
          if [ "$(( $(date +%s) - TYPELAY_INDEX_CHECK_START ))" -gt 1140 ]; then
            mkdir -p artifacts/index-production
            printf '%s\n' '{"scope":"linux-index-production-package-lifecycle","lifecycle":"not-run","reason":"insufficient-job-budget"}' > artifacts/index-production/result.json
            exit 1
          fi
          /usr/bin/python3 tests/linux/index_package_e2e.py --package artifacts/index-package --cache artifacts/index-model-download --output artifacts/index-production
      - name: Report required checks, including not-run prerequisites
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_REQUIRED_STEPS: >-
            index-package
            index-lifecycle
        run: python eng/shared/ci_report.py
      - name: Preserve only structured Index verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typelay-index-linux-${{ github.sha }}
          path: |
            artifacts/index-production/result.json
            artifacts/ci/
          if-no-files-found: warn
          retention-days: 14
