name: PR candidate
run-name: PR ${{ github.event.pull_request.number }} · ${{ github.event.pull_request.head.sha }} + ${{ github.event.pull_request.base.sha }}
'on':
  pull_request:
    branches: [hitl]
    types: [opened, reopened, synchronize, edited]
  workflow_call:
    inputs:
      base:
        required: true
        type: string
      head:
        required: true
        type: string
permissions:
  contents: read
env:
  BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ inputs.head || github.event.pull_request.head.sha }}
jobs:
  shared:
    name: hitl shared / ${{ inputs.base || github.event.pull_request.base.sha }}
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested: ${{ steps.candidate.outputs.tested }}
      tree: ${{ steps.candidate.outputs.tree }}
    permissions:
      contents: read
    steps:
    - name: Fetch the two event commits and their ancestry
      id: fetch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git init -q candidate
        git -C candidate -c 'credential.helper=!gh auth git-credential' fetch --no-tags \
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$BASE" "$HEAD_SHA"
    - name: Check out the merge of the two event commits
      id: candidate
      working-directory: candidate
      shell: bash
      run: |
        printf 'PR head: `%s`\n\nhitl base: `%s`\n\n' "$HEAD_SHA" "$BASE" | tee -a "$GITHUB_STEP_SUMMARY"
        printf 'Workflow: `%s` at `%s`\n\n' "$GITHUB_WORKFLOW_REF" "$GITHUB_WORKFLOW_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
        tree=$(git merge-tree --write-tree "$BASE" "$HEAD_SHA") || { echo "$tree"; exit 1; }
        export GIT_AUTHOR_DATE="$(git show -s --format=%cI "$BASE")"
        export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
        commit=$(git -c user.name=TypeLay -c user.email=ci@localhost commit-tree \
          "$tree" -p "$BASE" -p "$HEAD_SHA" -m 'TypeLay PR candidate')
        git checkout --detach "$commit"
        echo "tree=$tree" >> "$GITHUB_OUTPUT"
        echo "tested=$commit" >> "$GITHUB_OUTPUT"
        git show -s --format='Tested commit: `%H`%n%nSource tree: `%T`' | tee -a "$GITHUB_STEP_SUMMARY"
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: candidate/global.json
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Run the shared check as an unprivileged user
      shell: bash
      run: |
        sudo useradd --create-home typelay-test
        sudo mv candidate /home/typelay-test/source
        sudo chown -R typelay-test:typelay-test /home/typelay-test/source
        sudo -u typelay-test env -i HOME=/home/typelay-test PATH="$PATH" \
          DOTNET_ROOT="$DOTNET_ROOT" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" bash -ec '
            cd "$HOME/source"
            python -m venv "$HOME/venv"
            source "$HOME/venv/bin/activate"
            python -m pip install -r eng/requirements.txt -r tests/shared/requirements.txt
            pwsh -NoProfile -File ./dev.ps1 shared-check
          '
  failure-comparison:
    if: ${{ always() && (needs.shared.result == 'failure' || needs.shared.result == 'cancelled') }}
    needs: shared
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.base || github.event.pull_request.base.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Reconstruct the tested tree without checking out candidate code
      id: source
      if: needs.shared.outputs.tested != ''
      env:
        GH_TOKEN: ${{ github.token }}
        TESTED_TREE: ${{ needs.shared.outputs.tree }}
      run: |
        if { git cat-file -e "$HEAD_SHA^{commit}" || git -c 'credential.helper=!gh auth git-credential' fetch --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$HEAD_SHA"; } &&
           tree=$(git merge-tree --write-tree "$BASE" "$HEAD_SHA") && test "$tree" = "$TESTED_TREE"; then
          echo "CANDIDATE_SOURCE_TREE=$tree" >> "$GITHUB_ENV"
        fi
    - name: Publish candidate failure comparison from its trusted base
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        CANDIDATE_JOB: hitl shared / ${{ inputs.base || github.event.pull_request.base.sha }}
        CANDIDATE_TESTED_COMMIT: ${{ needs.shared.outputs.tested }}
      run: |
        if test -f eng/ci/failure_report.py; then
          python eng/ci/failure_report.py
        else
          echo "本次候选的 hitl 基线 \`$CANDIDATE_BASE\` 尚未提供失败对照，无法对照。" | tee -a "$GITHUB_STEP_SUMMARY"
        fi
  report:
    if: ${{ always() && github.event_name == 'push' }}
    needs: shared
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      RESULT: ${{ needs.shared.result }}
    steps:
    - name: Attach the shared check status to this head and base
      id: publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        case "$RESULT" in
          success|failure) state=$RESULT ;;
          *) state=error ;;
        esac
        gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
          -f state="$state" -f context="hitl shared / $BASE" \
          -f description="Shared check of PR head $HEAD_SHA with hitl" \
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
